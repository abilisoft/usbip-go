#
# Kernel modules required by usbipd-go (exporter side) and by
# usbip-go attach/detach (importer side). Drop this file at
# /etc/modules-load.d/usbip-go.conf so systemd-modules-load.service
# loads them at boot. usbip_core is the shared substrate; usbip_host
# is the device-side stub driver; vhci_hcd is the importer's
# virtual host controller. Operators running only one role can
# remove the irrelevant entry.
usbip_core
usbip_host
vhci_hcd
