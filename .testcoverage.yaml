#
# Per-package and total coverage thresholds per security-release-quality OpenSpec. Enforced against
# build/coverage/coverage.lcov by tools/scripts/coverage_check.sh through
# `make test-coverage` and `make ci-local`.

# The custom LCOV checker enforces package and total thresholds. The package
# threshold reflects the achievable floor across every package, with a
# documented rationale for the gap from the total target.
#
# Why 80% as the per-package floor and 90% as the total:
#
#   * pkg/domain, pkg/usbip, internal/app, internal/adapter/wire
#     all clear 90% under the current test surface — the pure-
#     logic packages.
#   * internal/adapter/{kernel,transport} carry a long tail of
#     errno-/sysfs-/netlink-specific error paths that the hermetic
#     Bazel unit-test environment cannot synthesise (EFAULT from
#     configfs, ENOMEM mid-bind, vhci_hcd module gone mid-attach).
#     The integration suite (test/integration) provokes those on the
#     dedicated kernel runner; raising the unit-test threshold beyond ~85%
#     would force test-only error injectors through every syscall.
#   * cmd/usbip-go is Cobra Action functions that wire pkg/usbip
#     Importer/Exporter through I/O. The package-level
#     newImporter / newExporter factories are the test seam, but
#     swapping them is a global mutation incompatible with the
#     project's paralleltest gate. Pure helpers (parseBackoff,
#     classifyEvent, table renderers, history) are tested
#     directly. Action-function bodies are exercised end-to-end
#     by the integration suite.
#
# Total 90% keeps the cross-package average honest while
# package 80% absorbs the cmd / kernel-adapter errno tail without
# forcing test-only production seams.
threshold:
  # Per-package floor at 80%. Total is the headline metric (90% below).
  # Per-package 80 is a regression alarm: most packages clear 90%
  # comfortably. Cobra-Action-heavy cmd packages and the kernel
  # adapter's errno tail fall in the 80-90 band where lifting further
  # requires test-only production seams (e.g. faking process exit,
  # synthesising EFAULT mid-bind). The total stays at 90% so the
  # headline number reflects coverage operators read.
  package: 80
  total: 90

# Skip paths that have no meaningful coverage surface.
exclude:
  paths:
    - ^internal/tools/
    - ^internal/testutil/
    - doc\.go$
    # test/integration/killable is a test-only subprocess built and
    # invoked by the integration-test harness (see
    # test/integration/process_death_test.go); it is never reached
    # by go test -race ./... so it produces 0% coverage and would
    # always fail any per-package threshold. Adding test scaffolding
    # would force the helper's invariants into the unit-test
    # surface, which is the wrong layer.
    - ^test/integration/killable($|/)
    # examples/* are documentation-grade demo programs whose main()
    # functions never run in unit tests. The smoke-test files under
    # examples/*/main_test.go already pin run() arg-validation; the
    # main() wrappers are 4-line cobra/exit-handling boilerplate
    # that would require gomock-style indirection just to cover
    # them — production code changes for the sake of testing.
    - ^examples/
    # main.go in the cmd/usbip-go binary is a 5-line wrapper
    # around cobra Execute + os.Exit; covering it would force
    # runtime exit-code interception that the run-loop tests
    # already cover via mainBody / runDaemon. Excluded so the
    # per-package floor reflects real testable surface.
    - ^cmd/usbip-go/main\.go$
    # Real syscall paths in the kernel adapter cannot be synthesised
    # under the hermetic Bazel unit-test environment; exercised by the integration
    # suite. See refactor commit isolating these to dedicated files.
    - ^internal/adapter/kernel/sysfs_real_linux\.go$
    - ^internal/adapter/kernel/netlink_real_linux\.go$
    # cmd/usbip-go statusExporter methods that pass through to the
    # concrete *usbip.Exporter (BoundDevices / Sessions / Drain) plus
    # defaultKernelModuleProbe; integration suite owns end-to-end
    # exercise.
    - ^cmd/usbip-go/status_exporter_concrete\.go$
    # Whole integration test tree only compiles under
    # `integration_linux` build tag; default `go test ./...` skips it
    # so it always reports 0% via the unit-test gate.
    - ^test/integration/
    # moq-generated mock files exist solely as test fakes; defensive
    # exclusion in case future moq output lands on a non-test file.
    - _mock_test\.go$
