# Hermetic dev environment for usbip-go.
#
# Two services, one shared /nix volume:
#
#   * `setup` runs as root with a minimal mount and the image's native
#     /etc/{passwd,group} still in place. Nix needs its `nixbld` build
#     group to populate the store, so `setup` is the only service that
#     may write to /nix.
#
#   * `dev` runs as the host UID/GID and bind-mounts the host's
#     /etc/{passwd,group} so container-side getpwuid/getgrgid resolve
#     to real names (required by TestStatusGroupChownResolvesCallerGroup
#     and similar tests that look up the caller's primary group).
#     It never writes to /nix — the Taskfile wires `task setup` as
#     a prerequisite of any command that would trigger a build.
#
# flake.nix defines what is *in* the shell; this file defines how
# to *enter* it from the host.

x-image: &image nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0

services:
  setup:
    image: *image
    # root is required so nix can own /nix/var/nix/db when building
    # the initial closure; ownership is handed to the host UID at the
    # end of the `task setup` command.
    user: "0:0"
    working_dir: /src
    volumes:
      - ./:/src:ro
      - nix-store:/nix
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    entrypoint: ["sh", "-c"]

  dev:
    image: *image
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    volumes:
      - ./:/src
      - nix-store:/nix
      # Synthetic two-line passwd/group files are generated by the
      # Taskfile (`_prep:identity`) before every dispatch. They bind
      # the container-side UID/GID to a synthetic `dev` user. Using a
      # synthesised file instead of the host's /etc files avoids
      # macOS Directory Services gaps where `getpwuid` misses the
      # invoking user even though the numeric UID is valid.
      - ./build/cache/passwd:/etc/passwd:ro
      - ./build/cache/group:/etc/group:ro
    environment:
      HOME: /src/build/cache/home
      XDG_CACHE_HOME: /src/build/cache
      GOCACHE: /src/build/cache/go-build
      GOMODCACHE: /src/build/cache/go-mod
      GOLANGCI_LINT_CACHE: /src/build/cache/golangci-lint
      GOBIN: /src/build/cache/go-bin
      IN_NIX_CONTAINER: "1"
      # build-users-group is cleared because the host /etc/group we
      # bind-mounted above does not contain nixbld. `dev` never builds;
      # if it tries, the user should re-run `task setup` instead.
      NIX_CONFIG: |-
        experimental-features = nix-command flakes
        build-users-group =
    entrypoint: ["nix", "develop", "--command"]

volumes:
  nix-store:
    # UID/GID-scoped so concurrent CI jobs on the same Docker host (or
    # a developer with multiple checkouts) never race on `chown -R /nix`.
    # Override USBIP_GO_NIX_VOLUME to share a store across workspaces.
    name: "${USBIP_GO_NIX_VOLUME:-usbip-go-${UID:-1000}-${GID:-1000}-nix-store}"
