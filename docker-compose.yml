#
# Local container entrypoints for users who do not have host Nix installed.
#
# The shared /nix volume is seeded by the root `setup` service for one named
# shell at a time (`task setup:dev`, `task setup:fmt`, `task setup:lint`,
# `task setup:vuln`, `task setup:mutation`, `task setup:qa`, `task setup:release`,
# `task setup:vm`).
# Normal work then runs as the host UID in the smallest shell that contains the
# requested tools:
#
#   * dev     — fast build/test shell
#   * fmt     — formatter shell
#   * lint    — lint/analyzer shell
#   * vuln    — vulnerability scanner shell
#   * mutation — mutation testing shell
#   * qa      — full QA shell for combined local checks
#   * release — GoReleaser, signing, SBOM, package, and changelog tooling
#   * vm      — microVM runner shell with /dev/kvm access

x-image: &image nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0

x-dev-volumes: &dev-volumes
  - ./:/src
  - nix-store:/nix
  - ./build/cache/passwd:/etc/passwd:ro
  - ./build/cache/group:/etc/group:ro

x-dev-environment: &dev-environment
  HOME: /src/build/cache/home
  XDG_CACHE_HOME: /src/build/cache
  GOCACHE: /src/build/cache/go-build
  GOMODCACHE: /src/build/cache/go-mod
  GOLANGCI_LINT_CACHE: /src/build/cache/golangci-lint
  GOBIN: /src/build/cache/go-bin
  IN_NIX_CONTAINER: "1"
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "safe.directory"
  GIT_CONFIG_VALUE_0: "/src"
  NIX_CONFIG: |-
    experimental-features = nix-command flakes
    build-users-group =

x-shell-service: &shell-service
  image: *image
  user: "${UID:-1000}:${GID:-1000}"
  group_add:
    - "${GID:-1000}"
  working_dir: /src
  volumes: *dev-volumes
  environment: *dev-environment

services:
  setup:
    image: *image
    user: "0:0"
    working_dir: /src
    volumes:
      - ./:/src:ro
      - nix-store:/nix
    environment:
      NIX_CONFIG: "experimental-features = nix-command flakes"
    entrypoint: ["sh", "-c"]

  dev:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: dev
    entrypoint: ["nix", "develop", ".#dev", "--command"]

  qa:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: qa
    entrypoint: ["nix", "develop", ".#qa", "--command"]

  fmt:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: fmt
    entrypoint: ["nix", "develop", ".#fmt", "--command"]

  lint:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: lint
    entrypoint: ["nix", "develop", ".#lint", "--command"]

  vuln:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: vuln
    entrypoint: ["nix", "develop", ".#vuln", "--command"]

  mutation:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: mutation
    entrypoint: ["nix", "develop", ".#mutation", "--command"]

  release:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: release
    entrypoint: ["nix", "develop", ".#release", "--command"]

  vm:
    !!merge <<: *shell-service
    environment:
      !!merge <<: *dev-environment
      USBIP_GO_NIX_SHELL: vm
    entrypoint: ["nix", "develop", ".#vm", "--command"]
    devices:
      - /dev/kvm:/dev/kvm
    group_add:
      - "${GID:-1000}"
      - "${USBIP_GO_KVM_GID:-993}"

volumes:
  nix-store:
    name: "${USBIP_GO_NIX_VOLUME:-usbip-go-${UID:-1000}-${GID:-1000}-nix-store}"
