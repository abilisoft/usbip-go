version: '3'

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
  LDFLAGS: '-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}'
  BIN_DIR: './bin'

# Release binaries are pure Go — CGO_ENABLED=0 is the project-wide default
# so `task build`, `task release`, and any ad-hoc `go build` run through
# the Taskfile produce static cgo-free artefacts. Test targets override to
# CGO_ENABLED=1 *only to enable the Go race detector* (-race requires cgo
# internally; the compiled test binary uses cgo, but the production
# binaries do not). The no-cgo CI guard scans source for `import "C"`
# so this split is safe: it is impossible to smuggle real cgo into the
# release binary without the guard catching it.
env:
  CGO_ENABLED: '0'

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  build:
    desc: Release-style build (pure Go, trimmed, stripped, reproducible)
    sources:
      - cmd/**/*.go
      - pkg/**/*.go
      - go.mod
      - go.sum
    generates:
      - '{{.BIN_DIR}}/usbip'
      - '{{.BIN_DIR}}/usbipd'
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/ ./cmd/...

  build:dev:
    desc: Dev build with full debug info (keeps paths for IDE click-through, disables inlining for delve)
    cmds:
      - go build -gcflags="all=-N -l" -o {{.BIN_DIR}}/ ./cmd/...

  test:
    desc: Unit tests with -race (test binary only; release binaries stay cgo-free)
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race -timeout=60s ./...

  test:integration:
    desc: Integration tests with -race
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race -tags=integration_linux -timeout=5m ./test/integration/...

  test:conformance:
    desc: Conformance tests (no -race — handshake-only byte comparisons)
    cmds:
      - go test -tags=conformance_linux -timeout=5m ./test/conformance/...

  test:cover:
    desc: Coverage report with -race
    env:
      CGO_ENABLED: '1'
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html

  test:mutation:
    desc: Mutation testing
    cmds:
      - gremlins unleash ./pkg/domain/... ./internal/adapter/wire/...

  changelog:
    desc: Regenerate CHANGELOG.md from Conventional Commit history via git-cliff
    cmds:
      - git-cliff --config cliff.toml --output CHANGELOG.md

  changelog:check:
    desc: Fail if CHANGELOG.md is out of date relative to current history
    cmds:
      - git-cliff --config cliff.toml > /tmp/cliff-expected.md
      - diff -u CHANGELOG.md /tmp/cliff-expected.md

  lint:
    desc: golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - gofumpt -w .
      - goimports -w .

  tidy:
    desc: go mod tidy
    cmds:
      - go mod tidy

  vuln:
    desc: govulncheck
    cmds:
      - govulncheck ./...

  check:
    desc: Pre-commit gauntlet
    cmds:
      - task: fmt
      - task: lint
      - task: vuln
      - task: test

  clean:
    desc: Remove build artefacts and cached test results
    cmds:
      - rm -rf {{.BIN_DIR}} coverage.out coverage.html dist/
      - go clean -testcache

  release:snapshot:
    desc: Snapshot release build via GoReleaser
    cmds:
      - goreleaser build --snapshot --clean

  release:
    desc: Tagged release via GoReleaser
    cmds:
      - goreleaser release --clean

  install-tools:
    desc: Install pinned dev tools into $GOBIN (versions from go.mod, not @latest)
    cmds:
      # Versions are pinned in go.mod via internal/tools/tools.go blank imports.
      # Using `-mod=mod` + no version suffix lets `go install` resolve against go.mod.
      - go install -mod=mod mvdan.cc/gofumpt
      - go install -mod=mod github.com/golangci/golangci-lint/v2/cmd/golangci-lint
      - go install -mod=mod golang.org/x/vuln/cmd/govulncheck
      - go install -mod=mod github.com/goreleaser/goreleaser/v2
      - go install -mod=mod github.com/matryer/moq
      - go install -mod=mod github.com/go-gremlins/gremlins/cmd/gremlins
      - go install -mod=mod golang.org/x/exp/cmd/apidiff
      - go install -mod=mod golang.org/x/tools/cmd/goimports
