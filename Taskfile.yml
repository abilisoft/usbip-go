version: '3'

# ------------------------------------------------------------------------------
# usbip-go Taskfile — canonical local and CI workflow.
#
# Normal build/test tasks use the fast Nix dev shell; lint/format/analyze,
# release, and VM tasks use separate heavier shells so everyday work does not
# realize unrelated tool closures. Local users do not need host Nix: outer tasks dispatch
# through docker-compose into the appropriate nixos/nix container. CI can call
# `nix develop .#<shell> --command task ci:<target>` directly.
#
# All build artefacts live under ./build/ so `task clean` is a single rm.
# ------------------------------------------------------------------------------

vars:
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "none"
  LDFLAGS: '-s -w -X main.version={{.VERSION}} -X main.commit={{.COMMIT}}'

  BUILD_DIR: '{{.ROOT_DIR}}/build'
  BIN_DIR: '{{.BUILD_DIR}}/bin'
  COVERAGE_DIR: '{{.BUILD_DIR}}/coverage'

  UID:
    sh: id -u
  GID:
    sh: id -g

env:
  CGO_ENABLED: '0'
  GOTOOLCHAIN: local
  GOBIN: '{{.BUILD_DIR}}/cache/go-bin'
  # Exported so docker-compose.yml's ${UID}/${GID} substitution resolves
  # regardless of shell (zsh does not export UID by default).
  UID: '{{.UID}}'
  GID: '{{.GID}}'
  # Default /nix volume name includes UID + GID + a CRC of the absolute
  # workspace path so multi-checkouts on the same machine (and the same
  # user running concurrent CI jobs on a shared Docker host) never alias
  # into one volume. Override to share a store across workspaces.
  USBIP_GO_NIX_VOLUME:
    sh: printf 'usbip-go-%s-%s-%s-nix-store' "$(id -u)" "$(id -g)" "$(printf '%s' "$PWD" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -c1-16)"

tasks:
  default:
    desc: List tasks
    cmds:
      - task --list

  # ----------------------------------------------------------------------------
  # Bootstrap: seed the shared /nix store volume for a specific shell.
  # Local users only need Docker/Compose; CI can call `nix develop .#<shell>`
  # directly. Splitting shells keeps everyday build/test setup from realizing
  # lint/analyzer, release, or VM closures.
  # ----------------------------------------------------------------------------
  setup:dev:
    desc: Seed local Docker/Nix volume for the fast build/test shell
    cmds:
      - 'docker compose run --rm setup "git config --global --add safe.directory /src && nix develop .#dev --command true && chown -R {{.UID}}:{{.GID}} /nix"'

  setup:qa:
    desc: Seed local Docker/Nix volume for lint, format, and analyzer tooling
    cmds:
      - 'docker compose run --rm setup "git config --global --add safe.directory /src && nix develop .#qa --command true && chown -R {{.UID}}:{{.GID}} /nix"'

  setup:release:
    desc: Seed local Docker/Nix volume for release tooling
    cmds:
      - 'docker compose run --rm setup "git config --global --add safe.directory /src && nix develop .#release --command true && chown -R {{.UID}}:{{.GID}} /nix"'

  setup:vm:
    desc: Seed local Docker/Nix volume for microVM tooling
    cmds:
      - 'docker compose run --rm setup "git config --global --add safe.directory /src && nix develop .#vm --command true && chown -R {{.UID}}:{{.GID}} /nix"'

  shell:
    desc: Open the fast build/test shell inside the local Docker/Nix container
    deps: ['_prep:identity', 'setup:dev']
    cmds:
      - docker compose run --rm -it --entrypoint 'nix develop .#dev' dev

  shell:qa:
    desc: Open lint, format, and analyzer shell inside the local Docker/Nix container
    deps: ['_prep:identity', 'setup:qa']
    cmds:
      - docker compose run --rm -it --entrypoint 'nix develop .#qa' qa

  shell:release:
    desc: Open release tooling shell inside the local Docker/Nix container
    deps: ['_prep:identity', 'setup:release']
    cmds:
      - docker compose run --rm -it --entrypoint 'nix develop .#release' release

  shell:vm:
    desc: Open microVM shell inside the local Docker/Nix container
    deps: ['_prep:identity', 'setup:vm']
    cmds:
      - docker compose run --rm -it --entrypoint 'nix develop .#vm' vm

  # ----------------------------------------------------------------------------
  # Outer tasks dispatch through the smallest shell that has the required tools.
  # Inside CI or an already-entered shell, call `task ci:*` directly.
  # ----------------------------------------------------------------------------
  build: {desc: 'Release build', cmds: [{task: '_run:dev', vars: {INNER: 'ci:build'}}]}
  build:dev: {desc: 'Dev build (debug info)', cmds: [{task: '_run:dev', vars: {INNER: 'ci:build:dev'}}]}
  test: {desc: 'Unit tests -race', cmds: [{task: '_run:dev', vars: {INNER: 'ci:test'}}]}
  test:integration: {desc: 'Integration tests', cmds: [{task: '_run:dev', vars: {INNER: 'ci:test:integration'}}]}
  test:conformance: {desc: 'Conformance tests', cmds: [{task: '_run:dev', vars: {INNER: 'ci:test:conformance'}}]}
  test:cover: {desc: 'Coverage HTML report', cmds: [{task: '_run:dev', vars: {INNER: 'ci:test:cover'}}]}
  test:mutation: {desc: 'Mutation tests', cmds: [{task: '_run:dev', vars: {INNER: 'ci:test:mutation'}}]}
  lint: {desc: 'All lint gates', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint'}}]}
  lint:go: {desc: 'golangci-lint', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:go'}}]}
  lint:yaml: {desc: 'yamllint', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:yaml'}}]}
  lint:actions: {desc: 'actionlint', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:actions'}}]}
  lint:markdown: {desc: 'rumdl markdown lint', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:markdown'}}]}
  lint:shell: {desc: 'shellcheck', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:shell'}}]}
  lint:spelling: {desc: 'typos spell check', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:spelling'}}]}
  lint:release: {desc: 'GoReleaser config check', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:release'}}]}
  lint:nix: {desc: 'Nix lint gates', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:nix'}}]}
  lint:toml: {desc: 'TOML lint', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:toml'}}]}
  lint:compose: {desc: 'Docker Compose config validation', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:compose'}}]}
  lint:openspec: {desc: 'OpenSpec strict validation', cmds: [{task: '_run:qa', vars: {INNER: 'ci:lint:openspec'}}]}
  fmt: {desc: 'Format code/docs/config', cmds: [{task: '_run:qa', vars: {INNER: 'ci:fmt'}}]}
  fmt:go: {desc: 'Format Go', cmds: [{task: '_run:qa', vars: {INNER: 'ci:fmt:go'}}]}
  fmt:yaml: {desc: 'Format YAML', cmds: [{task: '_run:qa', vars: {INNER: 'ci:fmt:yaml'}}]}
  fmt:markdown: {desc: 'Format Markdown', cmds: [{task: '_run:qa', vars: {INNER: 'ci:fmt:markdown'}}]}
  fmt:shell: {desc: 'Format shell scripts', cmds: [{task: '_run:qa', vars: {INNER: 'ci:fmt:shell'}}]}
  fmt:nix: {desc: 'Format Nix', cmds: [{task: '_run:qa', vars: {INNER: 'ci:fmt:nix'}}]}
  fmt:toml: {desc: 'Format TOML', cmds: [{task: '_run:qa', vars: {INNER: 'ci:fmt:toml'}}]}
  tidy: {desc: 'go mod tidy', cmds: [{task: '_run:dev', vars: {INNER: 'ci:tidy'}}]}
  tidy:check: {desc: 'Check go mod tidy drift', cmds: [{task: '_run:dev', vars: {INNER: 'ci:tidy:check'}}]}
  vuln: {desc: 'govulncheck', cmds: [{task: '_run:qa', vars: {INNER: 'ci:vuln'}}]}
  check: {desc: 'Pre-commit gauntlet', cmds: [{task: '_run:qa', vars: {INNER: 'ci:check'}}]}
  release:notes: {desc: 'Generate release notes', cmds: [{task: '_run:release', vars: {INNER: 'ci:release:notes'}}]}
  release:snapshot: {desc: 'GoReleaser snapshot', cmds: [{task: '_run:release', vars: {INNER: 'ci:release:snapshot'}}]}
  release: {desc: 'GoReleaser release', cmds: [{task: '_run:release', vars: {INNER: 'ci:release'}}]}

  vm:build: {desc: 'Build microVM closure', cmds: [{task: '_run:vm', vars: {INNER: 'ci:vm:build'}}]}
  vm:smoke: {desc: 'Boot microVM, verify USBIP modules load', cmds: [{task: '_run:vm', vars: {INNER: 'ci:vm:smoke'}}]}
  vm:test:integration: {desc: 'Run go test -tags=integration_linux inside microVM', cmds: [{task: '_run:vm', vars: {INNER: 'ci:vm:test:integration'}}]}

  # ----------------------------------------------------------------------------
  # Local-only: run GitHub Actions on this host via `act` to avoid burning
  # CI minutes on iteration. Runs OUTSIDE the dev container because act
  # drives docker-compose itself; mounting docker.sock recursively from
  # inside the dev container would deadlock on the same lock.
  #
  # Requires: docker CLI on PATH and the act binary from a host package
  # manager or GitHub Releases. act is not part of a Nix shell here.
  # ----------------------------------------------------------------------------
  act:list:
    desc: 'List actions/jobs that act would run for the push event'
    cmds:
      - act -l push
  act:push:
    desc: 'Run push-event jobs locally via act'
    cmds:
      - act push
  act:job:
    desc: 'Run a single job locally; pass JOB=<name>. Example: task act:job JOB=security'
    preconditions:
      - sh: '[ -n "{{.JOB}}" ]'
        msg: 'set JOB=<name>; see `task act:list`'
    cmds:
      - act push -j {{.JOB}}

  clean:
    desc: Remove build artefacts
    cmds:
      - find build -mindepth 1 -maxdepth 1 -exec rm -rf {} +

  # ----------------------------------------------------------------------------
  # Host → container dispatchers. `USBIP_GO_NIX_SHELL` is baked into each
  # compose service and flake shell so matching nested task calls run raw.
  # ----------------------------------------------------------------------------
  _run:dev:
    internal: true
    cmds:
      - |
        if [ "${USBIP_GO_NIX_SHELL:-}" = "dev" ]; then
          task {{.INNER}}
        else
          task _prep:identity
          task setup:dev
          docker compose run --rm dev task {{.INNER}}
        fi

  _run:qa:
    internal: true
    cmds:
      - |
        if [ "${USBIP_GO_NIX_SHELL:-}" = "qa" ]; then
          task {{.INNER}}
        else
          task _prep:identity
          task setup:qa
          docker compose run --rm qa task {{.INNER}}
        fi

  _run:release:
    internal: true
    cmds:
      - |
        if [ "${USBIP_GO_NIX_SHELL:-}" = "release" ]; then
          task {{.INNER}}
        else
          task _prep:identity
          task setup:release
          docker compose run --rm release task {{.INNER}}
        fi

  _run:vm:
    internal: true
    cmds:
      - |
        if [ "${USBIP_GO_NIX_SHELL:-}" = "vm" ]; then
          task {{.INNER}}
        else
          task _prep:identity
          task setup:vm
          docker compose run --rm vm task {{.INNER}}
        fi

  # ----------------------------------------------------------------------------
  # Synthesise a minimal /etc/passwd and /etc/group for the container to
  # bind-mount. Host files work on Linux but fail on macOS where the login
  # user is resolved via Directory Services and may not appear in the flat file.
  # ----------------------------------------------------------------------------
  _prep:identity:
    internal: true
    cmds:
      - mkdir -p {{.BUILD_DIR}}/cache
      - rm -rf {{.BUILD_DIR}}/cache/passwd {{.BUILD_DIR}}/cache/group
      - 'printf ''dev:x:%s:%s::/src/build/cache/home:/bin/sh\n'' {{.UID}} {{.GID}} > {{.BUILD_DIR}}/cache/passwd'
      - 'printf ''dev:x:%s:\n'' {{.GID}} > {{.BUILD_DIR}}/cache/group'

  # ----------------------------------------------------------------------------
  # Toolchain + cache preamble. Guards against go.mod/Nix-shell Go drift and
  # creates project-local cache/tool directories. Every ci:* target runs
  # this first.
  # ----------------------------------------------------------------------------
  _check:tooling:
    internal: true
    cmds:
      - mkdir -p {{.BUILD_DIR}}/cache/go-build {{.BUILD_DIR}}/cache/go-mod {{.BUILD_DIR}}/cache/go-bin {{.BUILD_DIR}}/cache/golangci-lint
      - |
        # Compare the max of the `go X.Y.Z` and optional `toolchain goX.Y.Z`
        # directives in go.mod against the active Nix-shell Go toolchain. Go
        # picks whichever is newer under GOTOOLCHAIN=local, so the guard
        # must too or it misses mismatches that would error at build time.
        mod=$({ awk '/^go [0-9]/ {print $2; exit}' go.mod;
                awk '/^toolchain go[0-9]/ {sub(/^go/,"",$2); print $2; exit}' go.mod; } \
               | sort -V | tail -n1)
        sh=$(go env GOVERSION | sed 's/^go//')
        [ "$mod" = "$sh" ] || { echo "go.mod/toolchain=$mod shell-go=$sh (mismatch; enter the correct Nix shell or update flake.nix)" >&2; exit 1; }

  # ----------------------------------------------------------------------------
  # Inner ci:* tasks — assume the appropriate Nix shell is active, emit into {{.BUILD_DIR}}.
  # ----------------------------------------------------------------------------
  ci:build:
    deps: ['_check:tooling']
    sources: [cmd/**/*.go, pkg/**/*.go, go.mod, go.sum]
    generates: ['{{.BIN_DIR}}/usbip-go']
    cmds:
      - go build -trimpath -ldflags="{{.LDFLAGS}}" -o {{.BIN_DIR}}/ ./cmd/...

  ci:build:dev:
    deps: ['_check:tooling']
    cmds:
      - go build -gcflags="all=-N -l" -o {{.BIN_DIR}}/ ./cmd/...

  ci:test:
    deps: ['_check:tooling']
    env: {CGO_ENABLED: '1'}
    cmds:
      - go test -race -timeout=180s ./cmd/... ./pkg/... ./internal/... ./test/...

  ci:test:integration:
    deps: ['_check:tooling']
    env: {CGO_ENABLED: '1'}
    cmds:
      - go test -race -tags=integration_linux -timeout=5m ./test/integration/...

  ci:test:conformance:
    deps: ['_check:tooling']
    cmds:
      - go test -tags=conformance_linux -timeout=5m ./test/conformance/...

  ci:test:cover:
    deps: ['_check:tooling']
    env: {CGO_ENABLED: '1'}
    cmds:
      - mkdir -p {{.COVERAGE_DIR}}
      - go test -race -coverprofile={{.COVERAGE_DIR}}/coverage.out ./cmd/... ./pkg/... ./internal/... ./test/...
      - go tool cover -html={{.COVERAGE_DIR}}/coverage.out -o {{.COVERAGE_DIR}}/coverage.html

  ci:test:mutation:
    deps: ['_check:tooling']
    env:
      GOBIN: '{{.BUILD_DIR}}/cache/go-bin'
    cmds:
      # Keep a pinned on-demand fallback so mutation testing remains one
      # command without expanding the fast build/test shell.
      - mkdir -p "$GOBIN"
      - 'command -v gremlins >/dev/null 2>&1 || go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0'
      # gremlins copies the ENTIRE module tree per worker via
      # filepath.Walk on the source dir; .gremlins.yaml's
      # `excluded-files` only filters mutation CANDIDATES, NOT the
      # workdir copy (see internal/engine/workdir/workdir.go:81 in
      # gremlins v0.6.0 — copyTo has no skip-dir logic). Running
      # straight from the repo root tries to copy build/cache/
      # (~900 MB of hermetic Go module + build cache) for every
      # worker, which panics with the placeholder error
      # `panic: error, this is temporary` once disk fills or the
      # walk hits a symlink loop.
      #
      # Stage a clean copy of the mutation-relevant source tree to
      # mktemp-d, run gremlins from there. GOMODCACHE stays pointed
      # at /src/build/cache/go-mod (set above by the env block) so
      # gremlins resolves modules without re-downloading. Trap on
      # EXIT cleans the stage even on failure.
      - |
        set -eu
        stage=$(mktemp -d -t usbip-go-mutation-XXXXXX)
        # EXIT-only trap because Taskfile shell is plain sh
        # (mvdan/sh) which rejects `INT TERM` signal-name args
        # to trap. EXIT fires on Ctrl-C and on normal/error exit.
        trap 'rm -rf "$stage"' EXIT
        cp go.mod go.sum .gremlins.yaml "$stage/"
        for d in cmd pkg internal test examples api; do
          [ -d "$d" ] && cp -r "$d" "$stage/"
        done
        cd "$stage"
        gremlins unleash ./pkg/domain
        gremlins unleash ./internal/adapter/wire

  ci:lint:
    deps: ['_check:tooling']
    cmds:
      - task: ci:lint:go
      - task: ci:lint:yaml
      - task: ci:lint:actions
      - task: ci:lint:markdown
      - task: ci:lint:shell
      - task: ci:lint:spelling
      - task: ci:lint:release
      - task: ci:lint:nix
      - task: ci:lint:toml
      - task: ci:lint:compose
      - task: ci:lint:openspec

  ci:lint:go:
    deps: ['_check:tooling']
    # Explicit module roots instead of ./...: the latter recurses into
    # build/cache/go-mod/, which the hermetic cache populates with
    # external module source on the first build. Linting that source
    # surfaces 200+ findings against third-party code we do not own and
    # cannot fix. The five roots listed cover every package the project
    # actually owns; build/cov_stats.go is a coverage helper inspected
    # by gofmt only and excluded from the lint surface deliberately.
    cmds: [golangci-lint run ./cmd/... ./pkg/... ./internal/... ./test/... ./examples/...]

  ci:lint:yaml:
    deps: ['_check:tooling']
    cmds:
      - yamllint --format parsable .yamllint .yamlfmt .github .golangci.yml .goreleaser.yml .gremlins.yaml .testcoverage.yaml Taskfile.yml docker-compose.yml openspec/config.yaml

  ci:lint:actions:
    deps: ['_check:tooling']
    cmds:
      # actionlint validates workflow syntax, expressions, reusable
      # workflow contracts, action inputs, and embedded run: scripts.
      # Passing shellcheck explicitly makes local and CI behavior match.
      - actionlint -shellcheck=shellcheck -ignore 'SC2016'

  ci:lint:markdown:
    deps: ['_check:tooling']
    cmds:
      - rumdl check README.md CONTRIBUTING.md CONTEXT.md SECURITY.md docs openspec .github/pull_request_template.md

  ci:lint:shell:
    deps: ['_check:tooling']
    cmds:
      - shellcheck scripts/*.sh

  ci:lint:spelling:
    deps: ['_check:tooling']
    cmds:
      - typos .

  ci:lint:release:
    deps: ['_check:tooling']
    cmds:
      - goreleaser check

  ci:lint:nix:
    deps: ['_check:tooling']
    cmds:
      - nixpkgs-fmt --check flake.nix
      - statix check flake.nix
      - deadnix --fail flake.nix

  ci:lint:toml:
    deps: ['_check:tooling']
    cmds:
      - taplo lint --no-schema .taplo.toml .rumdl.toml .typos.toml cliff.toml

  ci:lint:compose:
    deps: ['_check:tooling']
    cmds:
      - docker-compose config --quiet

  ci:lint:openspec:
    deps: ['_check:tooling']
    env:
      NPM_CONFIG_AUDIT: 'false'
      NPM_CONFIG_CACHE: '{{.BUILD_DIR}}/cache/npm'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      OPENSPEC_TELEMETRY: '0'
    cmds:
      - openspec validate --specs --strict

  ci:fmt:
    deps: ['_check:tooling']
    cmds:
      - task: ci:fmt:go
      - task: ci:fmt:yaml
      - task: ci:fmt:markdown
      - task: ci:fmt:shell
      - task: ci:fmt:nix
      - task: ci:fmt:toml

  ci:fmt:go:
    deps: ['_check:tooling']
    cmds:
      # gofmt -s simplifies redundant constructs (composite-literal
      # type elision, unnecessary type info). Run BEFORE gofumpt so
      # gofumpt's stricter rules see the simplified tree.
      #
      # `.` would recurse into build/cache/go-mod (the hermetic Go
      # module cache) where module source files are stored read-only;
      # gofmt -w would fail with "permission denied". Limit to our
      # own Go package roots.
      - gofmt -s -w cmd examples internal pkg test
      - gofumpt -w cmd examples internal pkg test
      - goimports -w cmd examples internal pkg test

  ci:fmt:yaml:
    deps: ['_check:tooling']
    cmds:
      - yamlfmt .

  ci:fmt:markdown:
    deps: ['_check:tooling']
    cmds:
      - rumdl fmt README.md CONTRIBUTING.md CONTEXT.md SECURITY.md docs openspec .github/pull_request_template.md

  ci:fmt:shell:
    deps: ['_check:tooling']
    cmds:
      - shfmt -w scripts/*.sh

  ci:fmt:nix:
    deps: ['_check:tooling']
    cmds:
      - nixpkgs-fmt flake.nix

  ci:fmt:toml:
    deps: ['_check:tooling']
    cmds:
      - taplo fmt .taplo.toml .rumdl.toml .typos.toml cliff.toml

  ci:fmt:check:
    # CI-only companion to ci:fmt. Fails if Go, YAML, Markdown, or shell
    # formatting would change. Local `task fmt` applies the same formatters.
    deps: ['_check:tooling']
    cmds:
      - task: ci:fmt:go:check
      - task: ci:fmt:yaml:check
      - task: ci:fmt:markdown:check
      - task: ci:fmt:shell:check
      - task: ci:fmt:nix:check
      - task: ci:fmt:toml:check

  ci:fmt:go:check:
    deps: ['_check:tooling']
    cmds:
      - |
        set -eu
        out=$(gofmt -s -l cmd examples internal pkg test)
        if [ -n "$out" ]; then
          printf '%s\n%s\n' 'gofmt -s -l reports drift; run task fmt:' "$out" >&2
          exit 1
        fi

  ci:fmt:yaml:check:
    deps: ['_check:tooling']
    cmds:
      - yamlfmt -lint .

  ci:fmt:markdown:check:
    deps: ['_check:tooling']
    cmds:
      - rumdl fmt --check README.md CONTRIBUTING.md CONTEXT.md SECURITY.md docs openspec .github/pull_request_template.md

  ci:fmt:shell:check:
    deps: ['_check:tooling']
    cmds:
      - shfmt -d scripts/*.sh

  ci:fmt:nix:check:
    deps: ['_check:tooling']
    cmds:
      - nixpkgs-fmt --check flake.nix

  ci:fmt:toml:check:
    deps: ['_check:tooling']
    cmds:
      - taplo fmt --check .taplo.toml .rumdl.toml .typos.toml cliff.toml

  ci:tidy:
    deps: ['_check:tooling']
    cmds:
      - |
        set -eu
        stage=$(mktemp -d -t usbip-go-tidy-XXXXXX)
        trap 'rm -rf "$stage"' EXIT
        cp go.mod go.sum "$stage/"
        for d in cmd pkg internal test examples api; do
          [ -d "$d" ] && cp -R "$d" "$stage/"
        done
        (cd "$stage" && go mod tidy)
        cp "$stage/go.mod" go.mod
        cp "$stage/go.sum" go.sum

  ci:tidy:check:
    deps: ['_check:tooling']
    cmds:
      - |
        set -eu
        stage=$(mktemp -d -t usbip-go-tidy-check-XXXXXX)
        trap 'rm -rf "$stage"' EXIT
        cp go.mod go.sum "$stage/"
        for d in cmd pkg internal test examples api; do
          [ -d "$d" ] && cp -R "$d" "$stage/"
        done
        (cd "$stage" && go mod tidy)
        cmp -s go.mod "$stage/go.mod" || { echo 'go.mod is not tidy; run task tidy' >&2; diff -u go.mod "$stage/go.mod" >&2 || true; exit 1; }
        cmp -s go.sum "$stage/go.sum" || { echo 'go.sum is not tidy; run task tidy' >&2; diff -u go.sum "$stage/go.sum" >&2 || true; exit 1; }

  ci:vuln:
    deps: ['_check:tooling']
    cmds: [govulncheck ./cmd/... ./pkg/... ./internal/... ./test/... ./examples/...]

  ci:vuln:sarif:
    # CI-only companion to ci:vuln. Emits a SARIF report so the CI
    # workflow can upload findings to GitHub's code-scanning surface
    # via github/codeql-action/upload-sarif. govulncheck writes the
    # full SARIF payload to stdout BEFORE the exit-code check, so a
    # nonzero exit (findings present) still leaves a complete file
    # on disk; the upload step runs with `if: always()` to guarantee
    # the SARIF lands on GitHub even when this task fails the build.
    deps: ['_check:tooling']
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - govulncheck -format=sarif ./cmd/... ./pkg/... ./internal/... ./test/... ./examples/... > {{.BUILD_DIR}}/govulncheck.sarif

  ci:check:
    deps: ['_check:tooling']
    cmds:
      - task: ci:fmt
      - task: ci:tidy:check
      - task: ci:lint
      - task: ci:vuln
      - task: ci:test

  ci:release:notes:
    deps: ['_check:tooling']
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - git-cliff --latest --strip header --output {{.BUILD_DIR}}/release-notes.md
      - test -s {{.BUILD_DIR}}/release-notes.md

  ci:release:snapshot:
    deps: ['_check:tooling']
    cmds: [goreleaser release --snapshot --clean --skip=sign, sbom, publish]

  ci:release:
    deps: ['_check:tooling']
    # RELEASE_NOTES, when set, points at a markdown file fed to
    # goreleaser via --release-notes; the file's contents become the
    # GitHub Release body verbatim. The release workflow generates
    # the file via git-cliff at tag time. Local invocation leaves
    # RELEASE_NOTES unset and lets goreleaser fall back to its own
    # generator (which is `disable: true` in .goreleaser.yml, so the
    # body would be empty — local task release runs are intended for
    # snapshot builds anyway).
    cmds:
      - |
        set -eu
        args=(release --clean)
        if [ -n "${RELEASE_NOTES:-}" ]; then
          args+=(--release-notes="$RELEASE_NOTES")
        fi
        goreleaser "${args[@]}"

  # ----------------------------------------------------------------------------
  # microVM — hermetic integration-test rig. flake.nix exposes
  # packages.x86_64-linux.microvm-run, a shell application whose closure
  # pins the kernel (with USBIP modules), initrd, toplevel, and qemu_kvm
  # binary. ci:vm:build materialises that closure under build/vm/run so
  # the runner can be re-invoked without re-evaluating the flake; ci:vm:smoke
  # stages a shell payload, boots the VM, and asserts every required USBIP
  # kernel module is present in /proc/modules before powering off.
  # ----------------------------------------------------------------------------
  ci:vm:build:
    deps: ['_check:tooling']
    cmds:
      - mkdir -p {{.BUILD_DIR}}/vm
      - nix build .#microvm-run -o {{.BUILD_DIR}}/vm/run

  ci:vm:smoke:
    deps: ['ci:vm:build']
    cmds:
      - mkdir -p {{.BUILD_DIR}}/vm
      - |
        cat > {{.BUILD_DIR}}/vm/cmd.sh <<'EOF'
        set -eu
        echo "[smoke] asserting USBIP kernel modules are loaded"
        for m in usbip_core vhci_hcd usbip_host usbip_vudc libcomposite; do
          if grep -qw "$m" /proc/modules; then
            echo "  ok: $m"
          else
            echo "  MISSING: $m" >&2
            exit 1
          fi
        done
        echo "VM_SMOKE_OK"
        EOF
      - chmod +x {{.BUILD_DIR}}/vm/cmd.sh
      # ci:vm:smoke runs inside the vm shell/container locally, so the src
      # path the runner shares into the VM is /src. CI sets the same path.
      - USBIP_GO_VM_SRC=/src {{.BUILD_DIR}}/vm/run/bin/usbip-go-microvm-run

  ci:vm:test:integration:
    deps: ['ci:vm:build']
    env: {CGO_ENABLED: '1'}
    cmds:
      - mkdir -p {{.BUILD_DIR}}/vm
      # The VM has `-net none`, so the test payload cannot resolve
      # proxy.golang.org. Pre-warm GOMODCACHE on the host (under the
      # same /src/build/cache/go-mod that the VM sees via 9p) by
      # compiling — but not running — the integration suite with the
      # `integration_linux` build tag. `go test -run=^$ -count=1` runs
      # no tests but exercises the full dep graph.
      - go test -race -tags=integration_linux -run '^$' -count=1 ./test/integration/...
      - |
        cat > {{.BUILD_DIR}}/vm/cmd.sh <<'EOF'
        set -euo pipefail
        export GOTOOLCHAIN=local
        export GOFLAGS=-trimpath
        export GOCACHE=/src/build/cache/go-build
        export GOMODCACHE=/src/build/cache/go-mod
        export CGO_ENABLED=1
        cd /src
        echo "[integration] go $(go env GOVERSION) on $(uname -rs)"
        echo "[integration] running ./test/integration/..."
        # -buildvcs=false: the VM does not share the host's .git tree
        # through 9p (it is under /src but git refuses to read it when
        # launched by systemd in the VM due to ownership rules), so
        # the Go build helper cannot stamp VCS info. Turn it off — the
        # test itself does not depend on version stamping.
        go test -race -v -count=1 -buildvcs=false -tags=integration_linux -timeout=5m ./test/integration/...
        echo VM_INTEGRATION_OK
        EOF
      - chmod +x {{.BUILD_DIR}}/vm/cmd.sh
      - USBIP_GO_VM_SRC=/src {{.BUILD_DIR}}/vm/run/bin/usbip-go-microvm-run
