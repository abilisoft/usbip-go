version: 2
run:
  timeout: 5m
  tests: true
formatters:
  # golangci-lint v2 splits formatters out of the linters list. Enable
  # the same trio that `task fmt` runs locally (gofmt -s -w, gofumpt -w,
  # goimports -w) so `task lint` enforces zero drift between developer
  # machines and Go Report Card's gofmt check. Without this block,
  # formatting violations only surface in the dedicated ci:fmt:check
  # gate; routing them through golangci-lint as well keeps the IDE
  # integration honest (golangci-lint-langserver flags drift as you
  # type).
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    gofmt:
      # simplify rewrites the `gofmt -s` patterns: composite-literal
      # type elision, `for _ = range x` -> `for range x`, redundant
      # type info on slice/map elements. Matches Taskfile.yml's
      # `gofmt -s -w`.
      simplify: true
linters:
  default: all
  disable:
    # Each disable requires a rationale per spec §9.4.
    - depguard      # enable once we configure an allowed-deps list (tracked as an open item)
    - exhaustruct   # fights functional options and zero-value defaults
    - varnamelen    # flags idiomatic short names (err, ctx, i)
    - wsl           # superseded by wsl_v5
    - nlreturn      # overlaps with wsl_v5
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 10
    cyclop:
      max-complexity: 10
    nestif:
      min-complexity: 4
    funlen:
      lines: 80
      statements: 40
    lll:
      line-length: 120
    wsl_v5:
      allow-first-in-block: true
      # Check names match bombsimon/wsl/v5.CheckFromString.
      # `expr-cuddling` in the spec maps to the `expr` check; `branch-max-lines` is
      # a separate config key (not a check) and is pinned below via branch-max-lines.
      enable:
        - assign-exclusive
        - assign-expr
        - expr
      branch-max-lines: 2
    nolintlint:
      require-explanation: true
      require-specific: true
    goconst:
      min-occurrences: 3
      min-len: 3
    ireturn:
      # domain.Event and kernel.NetlinkSocket are internal adapter
      # contracts — their whole purpose is to be returned across package
      # boundaries. Allow them in addition to ireturn's defaults. The
      # app.BackoffStrategy entry covers the pkg/usbip translation helper
      # that converts a public BackoffStrategy into the internal one; the
      # facade's role is exactly to return this internal interface value
      # into the internal app constructor. Public BackoffStrategy is also
      # whitelisted so future helpers constructing a default strategy
      # (used only internally) do not trip the linter.
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
        - 'github.com/abilisoft/usbip-go/internal/adapter/kernel\.NetlinkSocket'
        - 'github.com/abilisoft/usbip-go/pkg/domain\.Event'
        - 'github.com/abilisoft/usbip-go/internal/app\.BackoffStrategy'
        - 'github.com/abilisoft/usbip-go/pkg/usbip\.BackoffStrategy'
        - 'github.com/prometheus/client_golang/prometheus\.Registerer'
        # cmd/usbip-go exposes the Importer/Exporter/Renderer interfaces as
        # the substitution seams tested via mocks; factories and
        # pickers return the interface by design.
        - 'github.com/abilisoft/usbip-go/cmd/usbip-go\.Importer'
        - 'github.com/abilisoft/usbip-go/cmd/usbip-go\.Exporter'
        - 'github.com/abilisoft/usbip-go/cmd/usbip-go\.Renderer'
    mnd:
      ignored-functions:
        - 'make'
        - 'strconv.FormatInt'
        - 'strconv.FormatUint'
    tagliatelle:
      # cmd/usbip-go emits the public jsonlines schema v1 (spec §7.5) with
      # snake_case field names. The schema is frozen; camelCase would
      # silently break operators grep-ing field names.
      case:
        rules:
          json: snake
  exclusions:
    rules:
      - path: cmd/.+/.+\.go
        linters: [gochecknoglobals]  # cobra cmd vars are unavoidable; scoped here only
      - path: test/integration/killable/.+\.go
        # The killable subprocess is a hand-rolled main package whose
        # checkpoint writer must be reachable from package-level
        # init/run helpers; replicating cmd-style globals scoping
        # keeps the test-only binary out of the gochecknoglobals
        # surface.
        linters: [gochecknoglobals]
      - path: pkg/usbip/modules_linux\.go
        # probeStatFn is a test-injection seam for EACCES / EIO
        # simulation without chmod (which gosec G302 false-flags on
        # directory traversal bits). Swapped only in export_test.go.
        linters: [gochecknoglobals]
      - path: cmd/usbipd-go/main\.go
        # runWithContext threads ctx into cobra via cmd.SetContext +
        # cmd.Execute; contextcheck insists ctx flow through newRootCmd
        # as a parameter but cobra's PersistentPreRunE / RunE signatures
        # are fixed. cmd/usbip-go works around this by not having a ctx
        # parameter in run(); usbipd-go needs one because signal.NotifyContext
        # wraps the parent in main. The exclusion is scoped to this one
        # file so no other context-propagation smells escape review.
        linters: [contextcheck]
      - path: pkg/usbip/usbip\.go
        # The pkg/usbip facade is intentional 1:1 forwarding to
        # internal/app (spec §5.7). Wrapping each forwarded error with
        # fmt.Errorf would obscure sentinels and duplicate the
        # error-wrapping already performed inside internal/app. The
        # errors.Is chain relies on identity; this file must NOT wrap.
        linters: [wrapcheck]
      - path: internal/app/transport_options\.go
        # ValidateTransportOptions is a 1:1 re-export of netopts.Validate.
        # netopts.Validate already wraps ErrTransportOptionsInvalid; an
        # additional fmt.Errorf here would obscure the offending field
        # name without adding new context.
        linters: [wrapcheck]
      - path: _test\.go
        # Test files are exempt from complexity and magic-number linters
        # because table-driven tests with 10+ cases hit gocyclo / mnd
        # trivially, and tests routinely assert specific string and
        # numeric literals that goconst would flag. They are NOT exempt
        # from gochecknoglobals, paralleltest, or err113 — shared test
        # state, missing t.Parallel(), and ad-hoc errors.New() are
        # real smells even in tests.
        linters: [funlen, gocyclo, cyclop, gocognit, dupl, mnd]
      - path: _test\.go
        # Tests legitimately use math/rand/v2 for deterministic, seeded
        # PRNG streams (backoff jitter, etc.). crypto/rand would defeat
        # reproducibility and is not required — these streams are not
        # security primitives.
        text: 'G404:'
        linters: [gosec]
      - path: cmd/usbip-go/history\.go
        # The attach-history file lives under $XDG_STATE_HOME/usbip-go
        # (or $HOME/.local/state/usbip-go), a user-scoped path not
        # derived from untrusted input. G304 flags every non-constant
        # os.ReadFile; scoping the exclusion to this one file keeps
        # the broader G304 surface intact.
        text: 'G304:'
        linters: [gosec]
      - path: internal/adapter/transport/transport_options_linux_test\.go
        # rc.Control hands us the kernel file descriptor as uintptr
        # (Go's cross-platform shape); narrowing to int is safe on
        # Linux because fds always fit in a positive int. The lint
        # is a generic 64→32 narrowing warning that does not apply
        # to the Linux file-descriptor ABI.
        text: 'G115:'
        linters: [gosec]
      - path: internal/adapter/kernel/coverage_extra_test\.go
        # This file lives in `package kernel` (not `kernel_test`) so
        # it can call unexported helpers (commonAdapter,
        # newDispatcher, mapUDCEvent, parseStatusRowNumbers,
        # vhciEventMapper) without forcing exported test seams onto
        # production code purely for coverage. testpackage flags any
        # package-internal _test.go; that policy makes sense for the
        # public surface but conflicts here.
        linters: [testpackage]
      - path: internal/adapter/transport/coverage_internal_test\.go
        # Same rationale as kernel/coverage_extra_test.go: same-package
        # access to applySockopt, tuningListener, tuneDeadlines so
        # error branches can be reached without test-only production
        # exports.
        linters: [testpackage]
      - path: internal/app/coverage_whitebox_test\.go
        # Lives in `package app` (not `app_test`) to reach unexported
        # helpers: classifyDisconnectReason, eventEndsSessionForBusID,
        # classifyBindError, classifyUnbindError, ipFromAddr,
        # newSessionIDError. Promoting these to exported test seams
        # would pollute the public API surface; whitebox access is the
        # correct approach here.
        linters: [testpackage]
      - path: cmd/usbip-go/coverage_extra_test\.go
        # TestCompletionPathPerShell, TestCompletionPathUnknownShellRejected,
        # TestXDGDataHomeUsesEnvWhenSet, TestXDGDataHomeFallsBackToHomeDir
        # mutate process-wide environment via t.Setenv; t.Parallel +
        # t.Setenv on the same T panics at runtime. The paralleltest /
        # tparallel rules push for parallel execution by default; the
        # exclusion is scoped to this single file.
        linters: [paralleltest, tparallel]
      - path: cmd/usbip-go/no_color_help_test\.go
        # TestRunCtx_NoColorAppliedBeforeHelp / NoColorEqualsFormAlsoApplied
        # mutate the process-wide NO_COLOR env to verify that runCtx
        # propagates --no-color before fang renders help. Same
        # rationale as coverage_extra_test.go: t.Setenv pattern is
        # incompatible with t.Parallel.
        linters: [paralleltest, tparallel]
      - path: cmd/usbip-go/root_no_color_env_test\.go
        # TestPersistentPreRunE_NoColorSetsEnv mutates the process-wide
        # NO_COLOR env via os.Setenv (not t.Setenv — we need Cleanup
        # control). t.Parallel + direct os.Setenv is unsafe across tests.
        linters: [paralleltest, tparallel]
      - path: cmd/usbipd-go/style_no_color_test\.go
        # TestStyleWriter_NoColorEnvAppendsNormalized uses t.Setenv to
        # set NO_COLOR; t.Setenv is incompatible with t.Parallel.
        linters: [paralleltest, tparallel]
      - path: cmd/.+/binary_.+_test\.go
        # Binary-level integration tests build the project's own binary
        # in t.TempDir and exec it under exec.CommandContext. G204
        # (gosec subprocess with variable) flags every non-constant cmd
        # path; the path here is the test-controlled build artifact,
        # not untrusted input. Covers binary_smoke_test.go,
        # binary_missing_parent_dir_test.go, and any future
        # binary_*_test.go in the daemon and client packages.
        text: 'G204:'
        linters: [gosec]
      - path: internal/testutil/binbuild\.go
        # Test helper that builds the project binary into t.TempDir
        # before tests exec it. The exec.Command target is the just-
        # produced artifact; G204's "subprocess with variable" warning
        # does not apply to the build/exec test infrastructure.
        text: 'G204:'
        linters: [gosec]
      - path: internal/adapter/kernel/speed\.go
        # sysfsMbpsToSpeed is an immutable Mbps→domain.Speed lookup
        # table. Go has no const-map primitive, and replacing it with
        # a function that builds the map per call would defeat the
        # point of the lookup. Scoped exclusion documents the reason.
        linters: [gochecknoglobals]
      - path: internal/adapter/kernel/bind\.go
        # usbipHostBindRetryBackoffMs is a fixed-size compile-time
        # constant table for the EBUSY retry schedule. Same rationale
        # as speed.go: no const-array primitive, function rebuild
        # wastes allocation per Bind call.
        linters: [gochecknoglobals]
    # Generated files (standard header "Code generated ... DO NOT EDIT.") are
    # auto-detected by golangci-lint and skipped. All other files run against
    # the full linter set; there is no path-based exclusion for live code.
    generated: lax
