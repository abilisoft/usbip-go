#
# Codecov configuration. Mirrors `.testcoverage.yaml` exclude paths so
# the README badge percentage matches the gate-enforced number rather
# than showing a deflated headline pulled down by demo examples and
# the test-only kill-helper subprocess. `.testcoverage.yaml` remains the
# source of truth for local total and per-package enforcement; this file also
# configures Codecov's separate project and patch status checks.

ignore:
  # Generated third-party module sources committed only to make Go lint analysis
  # network-independent. Patch coverage remains exact for repository-owned code.
  - "vendor/**"

  # Internal scaffolding never reached by `go test ./...`.
  - "internal/tools/**"
  - "internal/testutil/**"

  # Documentation-grade demo programs whose main() functions never run
  # in unit tests. Smoke-test files under examples/*/main_test.go pin
  # arg-validation; the main() wrappers are 4-line cobra/exit-handling
  # boilerplate that would require gomock-style indirection just to
  # cover them — production code changes for the sake of testing.
  - "examples/**"

  # Test-only kill-helper subprocess built and invoked by the
  # integration-test harness; never reached by `go test -race ./...`
  # so it produces 0% coverage and would always deflate any total.
  - "test/integration/killable/**"

  # Skip whole-tree integration paths from the headline; they only
  # compile under the integration_linux build tag.
  - "test/integration/**"

  # main.go in the cmd/usbip-go binary: 5-line cobra Execute +
  # os.Exit wrapper; covered end-to-end via integration tests
  # rather than the unit suite. Mirrors the .testcoverage.yaml
  # carve-out.
  - "cmd/usbip-go/main.go"

  # Real syscall paths in the kernel adapter — sysfs writes and
  # AF_NETLINK socket operations whose error branches cannot be
  # synthesised hermetically. Exercised by the integration suite on
  # the dedicated kernel runner. Mirrors the .testcoverage.yaml carve-out.
  - "internal/adapter/kernel/sysfs_real_linux.go"
  - "internal/adapter/kernel/netlink_real_linux.go"

  # cmd/usbip-go statusExporter methods that pass through to the
  # concrete *usbip.Exporter; covered by the integration suite.
  - "cmd/usbip-go/status_exporter_concrete.go"

  # Auto-generated mocks — moq-emitted *_mock_test.go files live
  # alongside production code but exist solely as test fakes; they
  # would not appear in coverage anyway because they live under
  # _test.go but listing them here is defensive against future moq
  # output landing on production paths.
  - "**/*_mock_test.go"

  # Documentation-only Go files; doc.go bodies are package comments,
  # never executed.
  - "**/doc.go"

coverage:
  status:
    project:
      default:
        # Hard floor matches `.testcoverage.yaml` total. PR builds
        # fail this check if total coverage drops below the floor.
        target: 90%
        # Match the local floor exactly; do not hide regressions behind drift.
        threshold: 0%
    patch:
      default:
        # Every executable changed line must be covered. Patch coverage is a
        # separate hard gate from the repository-wide 90% floor.
        target: 100%
        threshold: 0%
