#
# Composite action: Determinate Systems Nix installer + FlakeHub
# cache restore. Every Nix-backed CI job repeats this pair verbatim;
# centralising it here is the single point of truth so a pin bump
# (e.g. nix-installer-action SHA) lands once instead of in 15+ jobs.
#
# This composite does NOT run actions/checkout — callers MUST run
# `actions/checkout` BEFORE `uses: ./.github/actions/setup-nix-dev`.
# Reason: GitHub Actions does NOT auto-stage local composite-action
# files when the calling workflow is a reusable workflow; the first
# step in the job MUST be checkout so the runner can find action.yml
# on disk. Non-reusable workflow callers also need an explicit
# checkout step first to keep the pattern consistent.
#
# Callers MUST grant `id-token: write` at the JOB level so
# flakehub-cache-action can mint its OIDC token. The composite
# action cannot grant permissions itself — only workflow/job blocks
# can.

name: Setup Nix dev environment
description: Install Nix and restore the FlakeHub cache.

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - uses: DeterminateSystems/flakehub-cache-action@771f7cc21370bb0b97ff0c5dc442073f9f45ebda # v3.19.0
