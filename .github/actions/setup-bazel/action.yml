name: Set up Bazel
description: Restore verified repository tools and Bazel download caches.

inputs:
  buildbuddy-api-key:
    description: BuildBuddy API key; an empty value preserves local caching.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Configure authenticated BuildBuddy caching
      if: inputs.buildbuddy-api-key != ''
      shell: bash
      env:
        BUILDBUDDY_API_KEY: ${{ inputs.buildbuddy-api-key }}
      run: |-
        umask 077
        printf '%s\n' \
          'common --config=buildbuddy' \
          "common --remote_header=x-buildbuddy-api-key=${BUILDBUDDY_API_KEY}" \
          > user.bazelrc
    - name: Restore Bazel caches
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .local/bazel-disk-cache
          .local/bazel-repository-cache
          .local/bazelisk
          .local/go-build-cache
          .local/go-mod
          .local/tools
        key: >-
          bazel-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bazelversion', 'MODULE.bazel.lock', 'deps.go.work', 'go.sum', 'tools/go.sum', 'tools/multitool.lock.json', 'tools/yamllint/requirements.lock') }}
        restore-keys: |
          bazel-v1-${{ runner.os }}-${{ runner.arch }}-
    - name: Bootstrap verified tools
      shell: bash
      run: make bootstrap
