name: Architecture checks

on:
  workflow_call:
    inputs:
      source-ref:
        description: Immutable source revision to check out; defaults to the caller event revision.
        required: false
        type: string
        default: ''
    secrets:
      BUILDBUDDY_ORG_API_KEY:
        description: Authenticates the optional BuildBuddy Bazel configuration.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  domain-boundary:
    name: Domain boundary rules
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      - name: Domain boundary rules
        run: make check-domain-boundaries

  pure-go:
    name: Pure Go enforcement
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      - name: Pure Go enforcement
        run: make check-pure-go

  api-compatibility:
    name: API compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - name: Restore trusted API baselines
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git show "${BASE_SHA}:api/pkg_domain.json" > api/pkg_domain.json
          git show "${BASE_SHA}:api/pkg_usbip.json" > api/pkg_usbip.json
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      - name: API compatibility
        run: make check-api-compatibility

  cross-compile:
    name: Linux cross-compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.3; v7 fails hosted setup here
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      - name: Linux cross-compilation
        run: make check-cross-compile

  release-stamping:
    name: Production release stamping
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      - name: Production release stamping
        run: make check-release-stamping
