#
# Reusable workflow: race-detector unit tests on Linux. Called from
# ci.yml on PR/push and from release.yml as a publish prerequisite.
# No interpolation of untrusted GitHub event fields anywhere; this
# file consumes only repo-controlled task definitions.

name: Unit tests (reusable)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Linux unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token: write — flakehub-cache-action OIDC.
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./.github/actions/setup-nix-dev
      - name: Test
        # task ci:test runs `go test -race -timeout=180s` over the owned
        # package roots inside the flake-pinned `.#dev` shell so the
        # toolchain matches go.mod and the race detector is always on
        # (CGO_ENABLED=1 is required for -race; the no-cgo policy applies
        # to PRODUCTION code, not the test binary).
        run: nix develop .#dev --command task ci:test
