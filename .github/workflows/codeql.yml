#
# CodeQL static analysis. Complements golangci-lint (lint-rule
# enforcement) and govulncheck (known-CVE scan) with deeper
# data-flow analysis tuned for security smells. SARIF results land
# in the GitHub Security tab.
#
# https://github.com/github/codeql-action

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly Wednesday 04:00 UTC — non-overlapping with mutation
    # (Mon 04:00) or scorecard (Tue 06:00).
    - cron: '0 4 * * 3'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-24.04
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13

      - name: Initialize CodeQL
        uses: github/codeql-action/init@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          languages: go
          # security-and-quality is the strictest pack; it includes
          # the security-extended pack plus code-quality smells. Use
          # `security-extended` if false-positive volume becomes a
          # problem.
          queries: security-and-quality

      # CodeQL needs a real Go toolchain to autobuild; the flake
      # devShell pins the same Go that go.mod requires. `go build
      # ./...` is enough — CodeQL traces calls from there.
      - name: Build Go module
        run: nix develop --command go build ./...

      - name: Perform analysis
        uses: github/codeql-action/analyze@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          category: "/language:go"
