name: Security gates

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: Upload govulncheck SARIF to GitHub code scanning.
        required: false
        type: boolean
        default: true
      source-ref:
        description: Immutable source revision to check out; defaults to the caller event revision.
        required: false
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  format-lint-vuln:
    name: Format, tidy, lint, and vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bazel
      - name: Strict lint suite
        run: make lint
      - name: Git history secret scan
        run: make gitleaks-history
      - name: Vulnerability scan
        id: govulncheck
        continue-on-error: true
        run: make govulncheck
      - name: Vulnerability scan SARIF
        if: inputs.upload-sarif
        run: make govulncheck-sarif
      - name: Upload govulncheck SARIF
        if: >-
          always() && inputs.upload-sarif && (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository) &&
           hashFiles('build/govulncheck.sarif') != ''
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          sarif_file: build/govulncheck.sarif
          category: govulncheck
      - name: Enforce vulnerability scan result
        if: always() && steps.govulncheck.outcome == 'failure'
        run: exit 1
