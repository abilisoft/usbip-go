#
# Reusable workflow: format checks + module-tidy drift + lint suite +
# govulncheck (SARIF upload to the Security tab). Called from ci.yml on
# every PR / push and from nightly.yml on the daily cron so a CVE
# published to the Go vuln DB pages within 24h instead of waiting for
# the next merge.
# Single source of truth — bumping lint/format configs or the
# upload-sarif action lands here, not in N copies.
#
# Underscore prefix marks this as not-directly-triggerable: only
# `workflow_call` is wired below.

name: Security gates (reusable)

on:
  workflow_call:
    inputs:
      upload-sarif:
        description: |
          Whether to upload the govulncheck SARIF to GitHub code
          scanning. Disabled automatically on fork-originated PRs
          (where GITHUB_TOKEN is read-only and the upload would
          fail). Callers can also force-disable for ad-hoc runs.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  format-lint-vuln:
    name: Format, tidy, lint, and vulnerability scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # id-token: write is needed by flakehub-cache-action for OIDC
      # auth. security-events: write is needed by upload-sarif so
      # govulncheck findings render on Security -> Code scanning.
      id-token: write
      security-events: write
    steps:
      # Composite actions stored in `./.github/actions/...` are NOT
      # auto-staged by reusable workflows; checkout MUST run first
      # so the runner can find action.yml on disk. fetch-depth: 1
      # — lint+vuln don't need history.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix-dev
      - name: Format check
        # Fails fast if any Go, YAML, Markdown, shell, Nix, or TOML file
        # would change under the project formatters. Catches drift that local
        # `task fmt` would auto-fix.
        run: nix develop .#fmt --command task ci:fmt:check
      - name: Module tidy check
        # Fails if `go mod tidy` would change go.mod or go.sum. This is
        # the same drift gate local `task check` runs before linting.
        run: nix develop .#dev --command task ci:tidy:check
      - name: Lint
        # Runs golangci-lint, yamllint, actionlint (+ shellcheck for
        # workflow run: blocks), rumdl, shellcheck, typos, Nix/TOML
        # linting, Compose validation, OpenSpec validation, and
        # goreleaser config validation.
        run: nix develop .#lint --command task ci:lint
      - name: Vuln (SARIF)
        # govulncheck -format=sarif writes the full SARIF payload to
        # stdout before the nonzero-on-findings exit, so the redirect
        # captures a complete file even when the step fails. Upload
        # below runs with `if: always()` to guarantee delivery.
        run: nix develop .#vuln --command task ci:vuln:sarif
      - name: Upload govulncheck SARIF
        # Skip on fork PRs: GitHub clamps GITHUB_TOKEN to read-only
        # there regardless of the job-scope security-events:write
        # grant, so upload-sarif would fail the job. Push and
        # same-repo PRs run normally. The caller can also force-
        # disable via inputs.upload-sarif=false.
        #
        # The two github.event.pull_request.head.repo.full_name
        # comparisons are repo *identifier* strings (e.g.
        # `octocat/hello`) — they cannot smuggle shell metacharacters
        # because they are compared inside the `if:` expression
        # context, never interpolated into a `run:` script.
        if: >-
          always() && inputs.upload-sarif && (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9e0d7b8d25671d64c341c19c0152d693099fb5ba # v4.35.5
        with:
          sarif_file: build/govulncheck.sarif
          # category disambiguates this scan from CodeQL, Scorecard,
          # Trivy uploads so each renders as its own column on the
          # code-scanning UI rather than overwriting prior runs.
          category: govulncheck
