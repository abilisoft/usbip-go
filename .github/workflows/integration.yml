name: Integration (microVM)
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  integration:
    name: Integration (hermetic microVM)
    runs-on: [self-hosted, linux, kvm]
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
      options: --device=/dev/kvm
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline. Bump the prefix when NIX_IMAGE digest changes.
          key: nix-integration-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-integration-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-integration-${{ runner.os }}-img-e2fe74e9-
      - name: Build microVM closure
        run: nix develop --command task ci:vm:build
      - name: Integration tests inside microVM
        run: nix develop --command task ci:vm:test:integration
