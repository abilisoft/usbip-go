name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_security.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  unit-tests:
    name: Unit
    permissions:
      contents: read
    uses: ./.github/workflows/_unit-tests.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  conformance:
    name: Conformance
    permissions:
      contents: read
    uses: ./.github/workflows/_conformance.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  arch:
    name: Architecture
    permissions:
      contents: read
    uses: ./.github/workflows/_arch-checks.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_coverage.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  tdd-discipline:
    name: TDD commit discipline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate PR commit policy and red-green pairs
        run: |-
          set -euo pipefail
          readonly commit_api_path="repos/${GITHUB_REPOSITORY}/commits"
          readonly conventional_subject_pattern='^[a-z][a-z0-9-]*(\([a-z0-9][a-z0-9._/-]*\))?!?: .+'
          readonly verified_signature_state='true'
          commits=$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then
            echo "No commits in PR range; skipping TDD discipline check."
            exit 0
          fi

          prev_red_sha=""
          fail=0
          for sha in $commits; do
            subject=$(git log -1 --format=%s "$sha")
            body=$(git log -1 --format=%B "$sha")
            commit_headers=$(git cat-file commit "$sha" \
              | awk 'BEGIN { in_headers = 1 } /^$/ { in_headers = 0 } in_headers')

            if ! grep -Eq "$conventional_subject_pattern" <<<"$subject"; then
              echo "FAIL: commit $sha has a non-conventional subject: $subject"
              fail=1
            fi

            if ! grep -q '^gpgsig ' <<<"$commit_headers"; then
              echo "FAIL: commit $sha is unsigned"
              fail=1
            fi

            if ! signature_verification=$(gh api "${commit_api_path}/${sha}" \
              --jq '.commit.verification | [.verified, .reason] | @tsv'); then
              echo "FAIL: unable to retrieve GitHub signature verification for commit $sha"
              fail=1
            else
              read -r signature_verified signature_reason <<<"$signature_verification"
              if [ "$signature_verified" != "$verified_signature_state" ]; then
                echo "FAIL: commit $sha signature is not GitHub-verified: $signature_reason"
                fail=1
              fi
            fi

            if grep -qiE '^Co-authored-by:' <<<"$body"; then
              echo "FAIL: commit $sha contains a forbidden Co-authored-by trailer"
              fail=1
            fi

            added_test=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$sha" \
              | { grep -E '_test\.go$' || true; })
            non_test_go=$(git diff-tree --no-commit-id --name-only -r "$sha" \
              | { grep -E '\.go$' || true; } \
              | { grep -v '_test\.go$' || true; } \
              | { grep -v '^internal/tools/' || true; })

            if [ -n "$prev_red_sha" ]; then
              if [ -z "$non_test_go" ] \
                  && ! grep -qiE '^refactor(\([^)]*\))?!?:' <<<"$subject"; then
                echo "FAIL: commit $sha (\"$subject\") follows RED commit $prev_red_sha but adds no non-test .go file and is not a refactor: commit"
                fail=1
              fi
              prev_red_sha=""
            fi

            if [ -n "$added_test" ] && [ -z "$non_test_go" ] \
                && grep -qiE '^(feat|fix)(\([^)]*\))?!?:' <<<"$subject"; then
              prev_red_sha="$sha"
            fi
          done

          if [ -n "$prev_red_sha" ]; then
            echo "FAIL: PR ends with dangling RED commit $prev_red_sha (test added, no following GREEN)"
            fail=1
          fi

          exit "$fail"
