name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly mutation testing — Mondays at 04:00 UTC. Non-blocking, files tracking issues on survivors.
    - cron: '0 4 * * 1'

permissions:
  contents: read

# Every job runs inside the upstream nixos/nix container so the only
# host-side dep on GitHub-hosted runners is Docker (already present).
# The flake drives the toolchain; jobs invoke the `task ci:*` inner
# targets directly without going through docker-compose — inside the
# container we are already in the hermetic environment that compose
# provides for local dev.
#
# NIX_IMAGE is pinned to the same digest the Taskfile uses locally;
# bump both together when a newer base is needed.

defaults:
  run:
    shell: bash

jobs:
  lint-and-vet:
    name: Lint & vuln
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache /nix store and db
        uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Lint
        run: nix develop --command task ci:lint
      - name: Vuln
        run: nix develop --command task ci:vuln

  unit-linux:
    name: Unit tests (linux)
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Test
        run: nix develop --command task ci:test

  unit-macos:
    name: Unit tests (macos)
    runs-on: macos-14
    # macOS runners cannot run the nixos/nix linux container. Install
    # nix natively via the Determinate Systems installer and run the
    # same ci:* inner targets — macOS's role here is catching
    # linux-only imports in shared packages, not exercising kernel
    # behaviour.
    env:
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v13
      - uses: DeterminateSystems/magic-nix-cache-action@v8
      - name: Test (catches Linux-only imports in shared packages)
        run: nix develop --command task ci:test

  conformance:
    name: Conformance (wire bytes + optional upstream usbip)
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Conformance tests
        run: nix develop --command task ci:test:conformance

  test-tdd-discipline:
    name: TDD discipline (Compliance Gate 3)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect PR commits for red->green pairs
        run: |
          set -euo pipefail
          commits=$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then
            echo "No commits in PR range; skipping TDD discipline check."
            exit 0
          fi
          prev_added_test=""
          fail=0
          for sha in $commits; do
            subject=$(git log -1 --format=%s "$sha")
            added_test=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$sha" | { grep -E '_test\.go$' || true; })
            non_test_go=$(git diff-tree --no-commit-id --name-only -r "$sha" | { grep -E '\.go$' || true; } | { grep -v '_test\.go$' || true; })
            if [ -n "$prev_added_test" ] && [ -z "$non_test_go" ] && ! printf '%s' "$subject" | grep -qiE '^refactor:' ; then
              echo "FAIL: commit $sha (\"$subject\") follows a RED commit but adds no implementation and is not labeled 'refactor:'"
              fail=1
            fi
            if [ -n "$added_test" ]; then
              prev_added_test="$sha"
            else
              prev_added_test=""
            fi
          done
          exit "$fail"

  api-surface:
    name: API surface (Compliance Gate 6)
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Diff exported API against baselines
        run: |
          nix develop --command bash -eu -c '
            # devShell does not export GOBIN (unlike the compose dev
            # service which sets it via docker-compose.yml), so pin one
            # under the hermetic cache tree before `go install`.
            export GOBIN="$PWD/build/cache/go-bin"
            mkdir -p "$GOBIN"
            go install golang.org/x/exp/cmd/apidiff
            for pkg in github.com/abilisoft/usbip-go/pkg/usbip github.com/abilisoft/usbip-go/pkg/domain; do
              short="${pkg##*/}"
              baseline="api/pkg_${short}.json"
              if [ ! -f "$baseline" ]; then
                echo "no baseline for $pkg at $baseline; skipping (Task 6.6 establishes baselines)"
                continue
              fi
              "$GOBIN/apidiff" "$pkg" "$baseline" > diff.txt
              cat diff.txt
              if grep -qE "^(Incompatible|Removed)" diff.txt; then
                if ! git log -1 --format=%s | grep -q "^BREAKING:" ; then
                  echo "API break without BREAKING: commit"; exit 1
                fi
              fi
            done
          '

  ddd-boundary:
    name: DDD boundary (Compliance Gate 5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: pkg/ must not import internal/
        run: |
          set -euo pipefail
          if [ -d pkg ] && grep -rEn 'github\.com/abilisoft/usbip-go/internal/' pkg/; then
            echo "pkg/ imports internal/ — boundary violation"
            exit 1
          fi
      - name: internal/app must not import internal/adapter/
        run: |
          set -euo pipefail
          if [ -d internal/app ] && grep -rEn 'github\.com/abilisoft/usbip-go/internal/adapter/' internal/app/; then
            echo "internal/app imports internal/adapter/ — boundary violation"
            exit 1
          fi

  no-cgo:
    name: No cgo (Compliance Gate 8)
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Authoritative cgo detection via go list
        # `go list -deps -f '{{.ImportPath}} {{.CgoFiles}}'` surfaces every
        # package that has cgo files — catches both single-line
        # `import "C"` and block-imports, generated cgo, and dotimports.
        run: |
          nix develop --command bash -eu -c '
            cgo_pkgs="$(go list -deps -f "{{if .CgoFiles}}{{.ImportPath}}{{end}}" ./... | grep -v "^$" || true)"
            if [ -n "$cgo_pkgs" ]; then
              echo "found packages with cgo files — CGO_ENABLED=0 policy violation:"
              echo "$cgo_pkgs"
              exit 1
            fi
            if grep -rnE "(^|[[:space:]])import[[:space:]]+\"C\"" --include="*.go" . ; then
              echo "found single-line import \"C\" — CGO_ENABLED=0 policy violation"
              exit 1
            fi
            if find . -name "*.go" -not -path "./.git/*" -print0 | xargs -0 -r awk "
                /^import[[:space:]]*\\(/ { in_blk=1; next }
                in_blk && /^\\)/          { in_blk=0; next }
                in_blk && /^[[:space:]]*\"C\"/ {
                    print FILENAME \":\" FNR \": block-form import \\\"C\\\" (cgo)\"
                    found=1
                }
                END { exit found ? 1 : 0 }
              "; then
              :
            else
              echo "found block-form import \"C\" — CGO_ENABLED=0 policy violation"
              exit 1
            fi
          '

  changelog-check:
    name: Changelog check (git-cliff) — release tags only
    runs-on: ubuntu-24.04
    # CHANGELOG.md is intrinsically one commit behind HEAD during
    # normal development (the commit that updates it cannot name
    # itself), so we only enforce full sync on release tags. Regular
    # PRs don't need a perfectly-synced changelog; the release
    # workflow runs `task changelog` as its first step.
    if: startsWith(github.ref, 'refs/tags/v')
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Verify CHANGELOG.md matches history at this tag
        run: nix develop --command task ci:changelog:check

  coverage:
    name: Coverage (Compliance Gate 4)
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Produce coverage profile
        run: nix develop --command task ci:test:cover
      - name: Enforce thresholds
        uses: vladopajic/go-test-coverage@v2
        with:
          config: ./.testcoverage.yaml
          profile: ./build/coverage/coverage.out

  cross-compile:
    name: Cross-compile (Compliance Gate 12)
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Phase-0 minimal cross build
        run: |
          nix develop --command bash -eu -c '
            GOOS=linux GOARCH=amd64 go build ./...
            GOOS=linux GOARCH=arm64 go build ./...
            GOOS=linux GOARCH=arm GOARM=7 go build ./...
          '

  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced on
          # one nixos/nix baseline is never restored over a different
          # baseline — `/nix/var/nix/db` registrations are baseline-
          # specific, and mismatching stores would leave Nix in an
          # inconsistent "path referenced but missing" state.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: Mutation tests
        run: nix develop --command task ci:test:mutation
