#
# CI orchestrator. Calls reusable workflows under
# `.github/workflows/_*.yml` so each gate has a single source of
# truth that other workflows (nightly.yml, release.yml, …) can also
# call without copy-paste drift.
#
# Triggers: push to main and PRs against main. Mutation testing has
# been split out to mutation.yml (label-gated PRs + weekly cron).
#
# Pattern: run every gate on a plain ubuntu-24.04 runner via the
# Determinate Systems Nix installer + Magic Nix Cache; flake-pinned
# toolchain (Go, golangci-lint, govulncheck, …) on PATH inside
# `nix develop --command`. We deliberately do NOT run jobs inside a
# minimal nix-only container image: GitHub Actions requires Node.js
# inside any job container so action-shipped JS code (notably
# actions/cache save/restore) can run, and a node-less Nix base
# image fails every JS action with "node: executable file not
# found". The plain runner has node out of the box.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workflow-root permissions clamped to read-only so OpenSSF
# Scorecard's Token-Permissions check passes; per-job blocks (and
# per-reusable-workflow blocks) elevate where needed.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Security
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/_security.yml

  unit-tests:
    name: Unit
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_unit-tests.yml

  conformance:
    name: Conformance
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_conformance.yml

  arch:
    name: Architecture
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_arch-checks.yml

  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_coverage.yml

  tdd-discipline:
    name: TDD commit discipline
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Inspect PR commits for red->green pairs
        # A commit is RED when it adds new test files AND ships no
        # production code in the same commit AND uses a behaviour-
        # introducing Conventional-Commits type (feat / fix). RED
        # commits MUST be immediately followed EITHER by a commit
        # that adds a non-test .go file (the GREEN) OR by a
        # `refactor:`-prefixed commit (the only accepted break in
        # the chain). Anything else (`docs:`/`chore:`/`ci:`/
        # `build:`/`perf:`/`style:`) leaves the RED unfollowed and
        # fails the gate. A trailing dangling RED at the end of
        # the PR also fails so an open RED can never
        # ship to main.
        run: |
          set -euo pipefail
          commits=$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then
            echo "No commits in PR range; skipping TDD discipline check."
            exit 0
          fi
          prev_red_sha=""
          fail=0
          for sha in $commits; do
            subject=$(git log -1 --format=%s "$sha")
            added_test=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$sha" \
              | { grep -E '_test\.go$' || true; })
            # non_test_go counts ONLY production source. We exclude
            # internal/tools/ because that path is the dev-tool
            # blank-import pin (build-tag-gated, never linked into
            # any binary); a deps-cleanup commit that touches only
            # tools.go must NOT silently satisfy a prior RED's GREEN
            # requirement (Codex MEDIUM finding).
            non_test_go=$(git diff-tree --no-commit-id --name-only -r "$sha" \
              | { grep -E '\.go$' || true; } \
              | { grep -v '_test\.go$' || true; } \
              | { grep -v '^internal/tools/' || true; })

            if [ -n "$prev_red_sha" ]; then
              # CONTRIBUTING.md "TDD discipline": after a RED commit
              # the next commit MUST add non-test .go (the GREEN)
              # OR be a `refactor:`-prefixed commit (the only
              # accepted break in the chain). Anything else
              # (including `chore:`/`docs:`/`ci:`) leaves the RED
              # unfollowed and fails the gate.
              if [ -z "$non_test_go" ] \
                  && ! printf '%s' "$subject" | grep -qiE '^refactor(\([^)]*\))?:' ; then
                echo "FAIL: commit $sha (\"$subject\") follows RED commit $prev_red_sha but adds no non-test .go file and is not a refactor: commit"
                fail=1
              fi
              # Whether or not the GREEN landed, clear the slot so
              # the next iteration assesses the next commit on its
              # own merits.
              prev_red_sha=""
            fi

            # Mark THIS commit as a new RED ONLY when it is a
            # `feat:`/`fix:` commit that ships tests but no
            # production code — i.e. a behaviour-introducing
            # commit that's incomplete. `test:` commits are
            # explicitly NOT carried forward as RED: in this
            # codebase `test(scope):` means "tests for already-
            # shipped code" (coverage hardening) rather than
            # strict-TDD test-first, and a `test:` commit on the
            # tip of a PR has no implementation that should follow
            # it. This matches the historic gate semantics; the
            # earlier "include test: in RED" attempt mis-classified
            # PR #17's `test(coverage):` patch-coverage commit and
            # blocked PR #18. CONTRIBUTING.md "TDD discipline"
            # documents this carve-out.
            if [ -n "$added_test" ] && [ -z "$non_test_go" ] \
                && printf '%s' "$subject" | grep -qiE '^(feat|fix)(\([^)]*\))?:' ; then
              prev_red_sha="$sha"
            fi
          done

          # Trailing dangling RED — last commit added tests with no
          # following GREEN. Without this guard the PR could merge
          # with an unfollowed RED at HEAD.
          if [ -n "$prev_red_sha" ]; then
            echo "FAIL: PR ends with dangling RED commit $prev_red_sha (test added, no following GREEN)"
            fail=1
          fi

          exit "$fail"
