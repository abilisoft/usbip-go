name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly mutation testing — Mondays at 04:00 UTC. Non-blocking, files tracking issues on survivors.
    - cron: '0 4 * * 1'

permissions:
  contents: read
  # id-token: write is required by DeterminateSystems/flakehub-cache-action
  # so it can mint a workflow-scoped OIDC token to authenticate against
  # FlakeHub Cache. The token never leaves the runner; it is exchanged
  # for a short-lived cache-service credential. Granted at workflow scope
  # so every job that runs the cache action inherits it.
  id-token: write

# Pattern: install Nix on a plain ubuntu-24.04 runner via the
# Determinate Systems action, let Magic Nix Cache handle the store
# cache, then run every job's commands inside `nix develop --command`
# so the flake-pinned toolchain (Go, golangci-lint, govulncheck, …)
# is on PATH.
#
# We deliberately do NOT run jobs inside a minimal nix-only container
# image: GitHub Actions requires Node.js inside any job container so
# action-shipped JS code (notably actions/cache save/restore) can run.
# A node-less Nix base image fails every JS action with "node:
# executable file not found". The plain runner has node out of the
# box, and Magic Nix Cache replaces the nix-store actions/cache entry
# that would otherwise live here.

defaults:
  run:
    shell: bash

jobs:
  lint-and-vet:
    name: Lint & vuln
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Lint
        run: nix develop --command task ci:lint
      - name: Vuln
        run: nix develop --command task ci:vuln

  unit-linux:
    name: Unit tests (linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Test
        run: nix develop --command task ci:test

  conformance:
    name: Conformance (wire bytes + optional upstream usbip)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Conformance tests
        run: nix develop --command task ci:test:conformance

  test-tdd-discipline:
    name: TDD discipline (Compliance Gate 3)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Inspect PR commits for red->green pairs
        run: |
          set -euo pipefail
          commits=$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}")
          if [ -z "$commits" ]; then
            echo "No commits in PR range; skipping TDD discipline check."
            exit 0
          fi
          prev_added_test=""
          fail=0
          for sha in $commits; do
            subject=$(git log -1 --format=%s "$sha")
            added_test=$(git diff-tree --no-commit-id --name-only --diff-filter=A -r "$sha" | { grep -E '_test\.go$' || true; })
            non_test_go=$(git diff-tree --no-commit-id --name-only -r "$sha" | { grep -E '\.go$' || true; } | { grep -v '_test\.go$' || true; })
            if [ -n "$prev_added_test" ] && [ -z "$non_test_go" ] && ! printf '%s' "$subject" | grep -qiE '^refactor:' ; then
              echo "FAIL: commit $sha (\"$subject\") follows a RED commit but adds no implementation and is not labeled 'refactor:'"
              fail=1
            fi
            if [ -n "$added_test" ]; then
              prev_added_test="$sha"
            else
              prev_added_test=""
            fi
          done
          exit "$fail"

  api-surface:
    name: API surface (Compliance Gate 6)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Diff exported API against baselines
        run: |
          nix develop --command bash -eu -c '
            # devShell does not export GOBIN (unlike the compose dev
            # service which sets it via docker-compose.yml), so pin one
            # under the hermetic cache tree before `go install`.
            export GOBIN="$PWD/build/cache/go-bin"
            mkdir -p "$GOBIN"
            go install golang.org/x/exp/cmd/apidiff
            for pkg in github.com/abilisoft/usbip-go/pkg/usbip github.com/abilisoft/usbip-go/pkg/domain; do
              short="${pkg##*/}"
              baseline="api/pkg_${short}.json"
              if [ ! -f "$baseline" ]; then
                echo "no baseline for $pkg at $baseline; skipping"
                continue
              fi
              "$GOBIN/apidiff" "$pkg" "$baseline" > diff.txt
              cat diff.txt
              if grep -qE "^(Incompatible|Removed)" diff.txt; then
                if ! git log -1 --format=%s | grep -q "^BREAKING:" ; then
                  echo "API break without BREAKING: commit"; exit 1
                fi
              fi
            done
          '

  ddd-boundary:
    name: DDD boundary (Compliance Gate 5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: pkg/domain must not import internal/
        # pkg/domain is the pure-stdlib value-object surface; it must
        # never reach into internal/. pkg/usbip is the public facade
        # and is allowed to import internal/* by design (see
        # docs/architecture.md "Layering rules").
        run: |
          set -euo pipefail
          if [ -d pkg/domain ] && grep -rEn 'github\.com/abilisoft/usbip-go/internal/' pkg/domain/; then
            echo "pkg/domain imports internal/ — boundary violation"
            exit 1
          fi
      - name: internal/app must not import internal/adapter/{kernel,transport}
        # internal/app declares adapter interfaces and consumes them
        # via dependency injection. It legitimately imports
        # internal/adapter/wire because codec value types appear on
        # those interface signatures, but it must not import the
        # kernel or transport adapter packages — those are reached
        # only through the declared interfaces.
        run: |
          set -euo pipefail
          if [ -d internal/app ] && grep -rEn 'github\.com/abilisoft/usbip-go/internal/adapter/(kernel|transport)' internal/app/; then
            echo "internal/app imports internal/adapter/{kernel,transport} — boundary violation"
            exit 1
          fi

  no-cgo:
    name: No cgo (Compliance Gate 8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Authoritative cgo detection via go list
        # `go list -f '{{.CgoFiles}}'` surfaces every OUR package
        # that has cgo files — catches both single-line `import "C"`
        # and block-imports, generated cgo, and dotimports. We DON'T
        # use -deps because Go stdlib (runtime/cgo, net, os/user)
        # ships cgo files that are only compiled under CGO_ENABLED=1;
        # listing them is irrelevant to our CGO_ENABLED=0 policy.
        run: |
          nix develop --command bash -eu -c '
            cgo_pkgs="$(go list -f "{{if .CgoFiles}}{{.ImportPath}}{{end}}" ./... | grep -v "^$" || true)"
            if [ -n "$cgo_pkgs" ]; then
              echo "found packages with cgo files — CGO_ENABLED=0 policy violation:"
              echo "$cgo_pkgs"
              exit 1
            fi
            if grep -rnE "(^|[[:space:]])import[[:space:]]+\"C\"" --include="*.go" . ; then
              echo "found single-line import \"C\" — CGO_ENABLED=0 policy violation"
              exit 1
            fi
            if find . -name "*.go" -not -path "./.git/*" -print0 | xargs -0 -r awk "
                /^import[[:space:]]*\\(/ { in_blk=1; next }
                in_blk && /^\\)/          { in_blk=0; next }
                in_blk && /^[[:space:]]*\"C\"/ {
                    print FILENAME \":\" FNR \": block-form import \\\"C\\\" (cgo)\"
                    found=1
                }
                END { exit found ? 1 : 0 }
              "; then
              :
            else
              echo "found block-form import \"C\" — CGO_ENABLED=0 policy violation"
              exit 1
            fi
          '

  coverage:
    name: Coverage (Compliance Gate 4)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Produce coverage profile
        run: nix develop --command task ci:test:cover
      - name: Enforce thresholds
        uses: vladopajic/go-test-coverage@f190f667e23b4441202d0bab0f8c2e7bce8925b6 # v2.18.4
        with:
          config: ./.testcoverage.yaml
          profile: ./build/coverage/coverage.out

  cross-compile:
    name: Cross-compile (Compliance Gate 12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Cross-platform build
        # CGO_ENABLED=0 for cross-builds: matches the no-cgo policy
        # gate plus avoids the host-toolchain cgo trap (cross-arch
        # `gcc` cannot assemble runtime/cgo's per-arch sources;
        # CGO_ENABLED=0 skips them entirely).
        run: |
          nix develop --command bash -eu -c '
            export CGO_ENABLED=0
            GOOS=linux GOARCH=amd64 go build ./...
            GOOS=linux GOARCH=arm64 go build ./...
            GOOS=linux GOARCH=arm GOARM=7 go build ./...
          '

  mutation:
    name: Mutation testing
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: Mutation tests
        run: nix develop --command task ci:test:mutation
