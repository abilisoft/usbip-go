name: Conformance

on:
  workflow_call:
    inputs:
      source-ref:
        description: Immutable source revision to check out; defaults to the caller event revision.
        required: false
        type: string
        default: ''
    secrets:
      BUILDBUDDY_ORG_API_KEY:
        description: Authenticates the optional BuildBuddy Bazel configuration.
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  conformance:
    name: USB/IP wire conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      - name: Conformance tests
        run: make test-conformance
