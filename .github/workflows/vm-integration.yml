name: VM integration

on:
  workflow_call:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Kernel integration tests
    runs-on: [self-hosted, linux, x64, usbip-kernel]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-bazel
      - name: Verify kernel integration environment
        run: |
          set -euo pipefail
          test "$(id -u)" -eq 0
          for module in usbip_core vhci_hcd usbip_host usbip_vudc; do
            test -d "/sys/module/${module}" || {
              echo "::error::required kernel module is not loaded: ${module}"
              exit 1
            }
          done
          test -d /sys/kernel/config/usb_gadget
          test -w /sys/kernel/config/usb_gadget
      - name: Run integration target
        run: make test-integration
