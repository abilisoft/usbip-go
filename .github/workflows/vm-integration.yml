#
# End-to-end tests against a real Linux kernel with usbip_core,
# vhci_hcd, usbip_host, usbip_vudc, and libcomposite loaded. The
# kernel boots via the Nix flake's microVM derivation under
# qemu_kvm; the test payload runs inside the VM with the project
# tree mounted via 9p.
#
# Trigger paths (slow workflow, NOT gated on every push):
#   - schedule: nightly so kernel-surface regressions page within 24h
#   - workflow_dispatch: manual reruns (e.g. after a flake bump or
#     for forced runs against PRs whose diff did not match the
#     `paths:` filter — note that GitHub does NOT run a workflow at
#     all on label events when `pull_request: paths:` is set and the
#     diff misses, so a "run-vm-integration" label gate is not
#     possible inline; use workflow_dispatch instead)
#   - pull_request when the PR touches integration tree, harness,
#     flake, Taskfile, the workflow file itself, OR any production
#     source under cmd/, internal/, pkg/ (a USB/IP stack change
#     SHOULD be gated by the kernel-surface check), OR go.mod/sum
#
# Runner: ubuntu-24.04 with nested KVM. Falls back to a self-hosted
# runner with /dev/kvm passthrough if the GitHub-hosted SKU stops
# exposing nested virt.

name: VM Integration

on:
  schedule:
    # Daily 04:45 UTC. Each scheduled workflow lands on a distinct
    # UTC minute so two crons never compete for the same
    # flakehub-cache shard:
    #   03:30  nightly (daily)
    #   04:10  codeql (Wed only)
    #   04:30  trivy (daily)
    #   05:15  mutation (Mon only)
    #   06:10  scorecard (Tue only)
    - cron: '45 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'pkg/**'
      - 'test/integration/**'
      - 'go.mod'
      - 'go.sum'
      - 'flake.nix'
      - 'flake.lock'
      - 'Taskfile.yml'
      - '.github/workflows/vm-integration.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

# Concurrency: cancel superseded runs on the same ref EXCEPT for
# manual workflow_dispatch — those should not be killed by the next
# scheduled tick or PR push.
concurrency:
  group: vm-integration-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  vm-tests:
    name: Kernel module smoke + integration suite
    runs-on: ubuntu-24.04
    # 90 minutes accommodates TCG software-emulation runs on
    # hosted runners (KVM-capable runners finish in 15-25 min
    # easily inside this bound). The actual hung-test catcher is
    # the per-Go-test deadline configured in Taskfile.yml; this
    # bound is the upper safety net.
    timeout-minutes: 90
    permissions:
      contents: read
      # id-token: write — required by DeterminateSystems/flakehub-cache-action
      # (v3.19.0+) to exchange the runner's OIDC token for cache auth.
      id-token: write
    # USBIP_GO_VM_ALLOW_TCG=1 lets the flake's microvm-run script
    # use `accel=kvm:tcg` instead of bare `kvm`. Result: qemu picks
    # KVM when /dev/kvm exists (fast, ~15 s smoke / 10–15 min
    # integration) and falls back to TCG software emulation when
    # /dev/kvm is missing (slow but functional, ~60-180 s smoke /
    # 30–60 min integration). This is the "works everywhere"
    # posture: hosted ubuntu-24.04 runners (no /dev/kvm in 2026 on
    # the standard SKU) still complete the gate; self-hosted KVM
    # runners stay fast. Without this we'd lose the whole
    # vm-integration tripwire on every hosted-runner PR.
    env:
      USBIP_GO_VM_ALLOW_TCG: '1'
    steps:
      - name: Detect virtualisation acceleration
        # Print which accel path will be exercised so the run log
        # shows whether this was a fast (KVM) or slow (TCG) sweep
        # at a glance — distinguishes a 30-minute hosted-runner
        # tcg run from a 10-minute self-hosted KVM run when
        # comparing CI durations.
        run: |
          if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "::notice title=KVM available::Booting microVM with hardware virtualisation."
            ls -la /dev/kvm
          else
            echo "::notice title=KVM unavailable::Falling back to TCG (qemu software emulation). Run will be slower than a /dev/kvm-capable runner."
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix-dev
      - name: VM smoke (kernel modules load)
        # Boots the microVM, asserts usbip_core / vhci_hcd /
        # usbip_host / usbip_vudc / libcomposite all loaded. Cheap
        # check on KVM (~15 s); runs first so an integration suite
        # never starts against a broken VM image. On TCG closer to
        # 60-120 s, still well under the 45-minute job timeout.
        run: nix develop --command task ci:vm:smoke
      - name: Integration suite inside microVM
        # Runs `go test -tags=integration_linux ./test/integration/...`
        # inside the booted microVM via 9p split mounts (/src ro,
        # /src/build/cache rw). KVM: 15-25 min. TCG: 30-60 min,
        # potentially 90 — the 45-minute job timeout above is a
        # conservative bound that catches a hung test instead of
        # an infrastructure-paced run. If TCG genuinely needs
        # longer the bound moves up; the tripwire stays useful
        # either way because integration failures usually surface
        # in the smoke step.
        run: nix develop --command task ci:vm:test:integration
