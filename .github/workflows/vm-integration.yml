name: VM integration

on:
  workflow_call:
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: Kernel integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Restore kernel VM image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .local/kernel-vm/images
          key: kernel-vm-debian-trixie-20260706-2531
      - name: Install VM tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes \
            cloud-image-utils \
            qemu-system-x86
      - name: Run integration target in kernel VM
        run: ./tools/scripts/run_kernel_integration_vm.sh
