name: VM Integration

# End-to-end tests against a real Linux kernel with usbip_core,
# vhci_hcd, usbip_host, usbip_vudc, and libcomposite loaded. The
# kernel boots via the Nix flake's microVM derivation under
# qemu_kvm; the test payload runs inside the VM with the project
# tree mounted via 9p.
#
# Trigger paths (slow workflow, NOT gated on every push):
#   - schedule: nightly so kernel-surface regressions page within 24h
#   - workflow_dispatch: manual reruns after a flake bump
#   - pull_request when the PR touches the integration tree, harness,
#     flake, Taskfile, or this workflow file
#
# Runner: ubuntu-24.04 with nested KVM. Falls back to a self-hosted
# runner with /dev/kvm passthrough if the GitHub-hosted SKU stops
# exposing nested virt.

on:
  schedule:
    # 04:30 UTC daily — well after the 03:30 nightly vuln/lint run.
    - cron: '30 4 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'test/integration/**'
      - 'flake.nix'
      - 'flake.lock'
      - '.github/workflows/vm-integration.yml'
      - 'Taskfile.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: vm-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vm-smoke:
    name: VM smoke (kernel modules load)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # id-token: write — required by DeterminateSystems/flakehub-cache-action
      # (v3.19.0+) to exchange the runner's OIDC token for cache auth.
      id-token: write
    steps:
      - name: Verify nested KVM availability
        run: |
          if ! [ -r /dev/kvm ] || ! [ -w /dev/kvm ]; then
            echo "/dev/kvm not accessible — runner does not expose nested virtualisation."
            echo "Switch to a self-hosted runner with KVM passthrough."
            exit 1
          fi
          ls -la /dev/kvm
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@771f7cc21370bb0b97ff0c5dc442073f9f45ebda # v3.19.0
      - name: Boot microVM, verify USBIP kernel modules
        run: nix develop --command task ci:vm:smoke

  vm-integration:
    name: VM integration (test/integration/)
    runs-on: ubuntu-24.04
    needs: vm-smoke
    timeout-minutes: 30
    permissions:
      contents: read
      # id-token: write — required by DeterminateSystems/flakehub-cache-action
      # (v3.19.0+) to exchange the runner's OIDC token for cache auth.
      id-token: write
    steps:
      - name: Verify nested KVM availability
        run: |
          if ! [ -r /dev/kvm ] || ! [ -w /dev/kvm ]; then
            echo "/dev/kvm not accessible"
            exit 1
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@771f7cc21370bb0b97ff0c5dc442073f9f45ebda # v3.19.0
      - name: Run integration suite inside microVM
        run: nix develop --command task ci:vm:test:integration
