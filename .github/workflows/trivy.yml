name: Trivy

# Filesystem vulnerability + misconfiguration scan. Runs in its own
# workflow file (rather than as a step in ci.yml) so the README can
# carry a workflow-status badge specific to Trivy without coupling
# its pass/fail signal to the rest of the CI matrix.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily refresh against the Trivy DB so newly disclosed CVEs
    # surface even on idle weeks. 04:30 UTC matches the cadence of
    # the existing nightly mutation cron.
    - cron: '30 4 * * *'

# Workflow-root permissions are clamped to read-only; the writes the
# upload-sarif step needs (security-events:write) are granted at job
# scope only. OpenSSF Scorecard's Token-Permissions check flags any
# write at workflow root.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scan:
    name: Trivy filesystem scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # security-events:write is the GitHub-OIDC scope upload-sarif
      # uses to write into the code-scanning surface.
      security-events: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run Trivy filesystem scan
        # scan-type:fs walks the working tree (Go module deps,
        # Dockerfile, license metadata, etc.) and emits one SARIF
        # report. exit-code:0 keeps the action from failing the
        # workflow on findings — the SARIF upload below surfaces them
        # on the Security tab where they can be triaged, and the
        # workflow status badge reflects scanner health, not CVE
        # count. Severity is filtered to HIGH/CRITICAL to keep the
        # signal-to-noise ratio meaningful for a userspace daemon.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Upload Trivy SARIF
        # Skip the upload on fork-originated PRs: GitHub clamps the
        # GITHUB_TOKEN on those runs to read-only regardless of the
        # job-scope `security-events: write` grant, so upload-sarif
        # would fail and turn the badge red on every fork PR. Push
        # events and same-repo PRs run normally.
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@95e58e9a2cdfd71adc6e0353d5c52f41a045d225 # v4.35.2
        with:
          sarif_file: trivy.sarif
          # category disambiguates from CodeQL / Scorecard /
          # govulncheck SARIF uploads so each appears as its own
          # column on the code-scanning UI.
          category: trivy
