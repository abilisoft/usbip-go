name: Coverage

on:
  workflow_call:
    inputs:
      source-ref:
        description: Immutable source revision to check out; defaults to the caller event revision.
        required: false
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: ./.github/actions/setup-bazel
      - name: Coverage thresholds
        run: make test-coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: ./build/coverage/coverage.lcov
          use_oidc: true
          fail_ci_if_error: false
          verbose: false
