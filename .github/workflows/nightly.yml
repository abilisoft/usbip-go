#
# Nightly re-run of the security gate against `main`. Catches new
# CVEs published to the Go vuln DB and lint-rule additions in
# golangci-lint releases without waiting for a push or PR. The
# regular CI workflow (.github/workflows/ci.yml) already runs the
# same gate on every push and pull request via the SAME reusable
# workflow (_security.yml) — this nightly call is a zero-code-change
# rerun so an upstream regression pages within 24h instead of
# waiting for the next merge.
#
# Manual dispatch is enabled for ad-hoc reruns (e.g. immediately
# after a CVE disclosure) without waiting for the cron tick.

name: Nightly

on:
  schedule:
    # Daily 03:30 UTC — well clear of all weekly crons:
    #   Mon 05:15  mutation testing
    #   Tue 06:10  scorecard
    #   Wed 04:10  codeql
    # and the daily 04:30 trivy run.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      contents: read
      id-token: write
      security-events: write
    uses: ./.github/workflows/_security.yml
