name: Nightly

# Nightly govulncheck + golangci-lint against `main`. Catches new
# CVEs published to the Go vuln DB and lint-rule additions in
# golangci-lint releases without waiting for a push or PR. The
# regular CI workflow (.github/workflows/ci.yml) already runs the
# same gates on every push and pull request — this job's purpose is
# zero-code-change reruns so an upstream regression pages within 24h
# instead of waiting for the next merge.
#
# Manual dispatch is enabled for ad-hoc reruns (e.g. immediately
# after a CVE disclosure) without waiting for the cron tick.

on:
  schedule:
    # 03:30 UTC daily — well before the 04:00 weekly mutation cron in
    # ci.yml so the two runs do not contend for the same nix-store
    # cache shard on Mondays.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
# id-token:write is granted at job scope. Scorecard's Token-Permissions
# check flags non-read permissions at workflow root.

defaults:
  run:
    shell: bash

jobs:
  vuln-and-lint:
    name: govulncheck + golangci-lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1
      - name: govulncheck
        run: nix develop --command task ci:vuln
      - name: golangci-lint
        run: nix develop --command task ci:lint
