name: Nightly

# Nightly govulncheck + golangci-lint against `main`. Catches new
# CVEs published to the Go vuln DB and lint-rule additions in
# golangci-lint releases without waiting for a push or PR. The
# regular CI workflow (.github/workflows/ci.yml) already runs the
# same gates on every push and pull request — this job's purpose is
# zero-code-change reruns so an upstream regression pages within 24h
# instead of waiting for the next merge.
#
# Manual dispatch is enabled for ad-hoc reruns (e.g. immediately
# after a CVE disclosure) without waiting for the cron tick.

on:
  schedule:
    # 03:30 UTC daily — well before the 04:00 weekly mutation cron in
    # ci.yml so the two runs do not contend for the same nix-store
    # cache shard on Mondays.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  vuln-and-lint:
    name: govulncheck + golangci-lint
    runs-on: ubuntu-24.04
    container:
      image: nixos/nix@sha256:e2fe74e96e965653c7b8f16ac64d1e56581c63c84d7fa07fb0692fd055cd06b0
    env:
      NIX_CONFIG: |
        experimental-features = nix-command flakes
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: "safe.directory"
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
      IN_NIX_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cache /nix store and db
        uses: actions/cache@v4
        with:
          path: |
            /nix/store
            /nix/var/nix/db
          # Image-digest prefix in the cache key so a cache produced
          # on one nixos/nix baseline is never restored over a
          # different baseline. Same scheme as ci.yml.
          key: nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-${{ hashFiles('flake.nix') }}
          restore-keys: |
            nix-${{ runner.os }}-img-e2fe74e9-${{ hashFiles('flake.lock') }}-
            nix-${{ runner.os }}-img-e2fe74e9-
      - name: govulncheck
        run: nix develop --command task ci:vuln
      - name: golangci-lint
        run: nix develop --command task ci:lint
