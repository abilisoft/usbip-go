name: Nightly

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_security.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  unit-tests:
    name: Unit
    permissions:
      contents: read
    uses: ./.github/workflows/_unit-tests.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  conformance:
    name: Conformance
    permissions:
      contents: read
    uses: ./.github/workflows/_conformance.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  coverage:
    name: Coverage
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_coverage.yml
    secrets:
      BUILDBUDDY_ORG_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}

  snapshot:
    name: Snapshot release packaging
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup-bazel
        with:
          buildbuddy-api-key: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
      - name: Snapshot release packaging
        run: make release-snapshot
