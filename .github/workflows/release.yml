name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  validate-tag:
    name: Validate tag shape
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate stable SemVer tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '${TAG}' is not a canonical stable release (vMAJOR.MINOR.PATCH)"
            exit 1
          fi

  security:
    name: Security
    needs: validate-tag
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/_security.yml

  unit-tests:
    name: Unit
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/_unit-tests.yml

  conformance:
    name: Conformance
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/_conformance.yml

  arch:
    name: Architecture
    needs: validate-tag
    permissions:
      contents: read
    uses: ./.github/workflows/_arch-checks.yml

  coverage:
    name: Coverage
    needs: validate-tag
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/_coverage.yml

  release:
    name: Build draft release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - arch
      - conformance
      - coverage
      - security
      - unit-tests
    outputs:
      hashes: ${{ steps.hash-artifacts.outputs.hashes }}
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - uses: ./.github/actions/setup-bazel
      - name: Local CI gate
        run: make ci-local
      - name: Generate release notes
        run: |
          set -euo pipefail
          mkdir -p build
          make changelog > build/release-notes.md
          test -s build/release-notes.md
      - name: Stage draft release
        run: make release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NOTES: build/release-notes.md
      - name: Hash release artifacts for SLSA provenance
        id: hash-artifacts
        working-directory: build/dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( *.tar.gz *.deb *.rpm )
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "no release artifacts to hash; GoReleaser produced none" >&2
            exit 1
          fi
          hashes=$(sha256sum "${artifacts[@]}" | base64 -w0)
          echo "hashes=$hashes" >> "$GITHUB_OUTPUT"

  provenance:
    name: Generate SLSA provenance
    needs: [release]
    permissions:
      actions: read
      contents: write
      id-token: write
    # SLSA's generic generator is intentionally referenced by version tag rather
    # than commit SHA: slsa-verifier expects the trusted-builder identity to use
    # the tagged reusable workflow ref.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      draft-release: 'true'
      upload-assets: true

  publish:
    name: Publish attested release
    needs: [provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          release_id=$(gh api "repos/${REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"${TAG}\" and .draft == true) | .id")
          if [ -z "${release_id}" ]; then
            echo "::error::draft release for ${TAG} not found"
            exit 1
          fi
          gh api --method PATCH "repos/${REPOSITORY}/releases/${release_id}" \
            -F draft=false >/dev/null
