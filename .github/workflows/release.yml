name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# id-token: write is required for cosign keyless signing via GitHub
# OIDC. contents: write lets goreleaser create the GitHub Release and
# upload assets.
permissions:
  contents: write
  id-token: write

env:
  COSIGN_EXPERIMENTAL: '1'

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v13
      - uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Unit tests before release
        run: nix develop --command task ci:test

      - name: GoReleaser (goreleaser, syft, cosign, nfpm all from the flake closure)
        run: nix develop --command task ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: '1'
