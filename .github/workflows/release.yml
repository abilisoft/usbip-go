name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# id-token: write is required for cosign keyless signing via GitHub
# OIDC. contents: write lets goreleaser create the GitHub Release and
# upload assets.
permissions:
  contents: write
  id-token: write

env:
  COSIGN_EXPERIMENTAL: '1'

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8

      - name: Unit tests before release
        run: nix develop --command task ci:test

      - name: GoReleaser (goreleaser, syft, cosign, nfpm all from the flake closure)
        run: nix develop --command task ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: '1'
