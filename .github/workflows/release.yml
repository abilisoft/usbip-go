name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Workflow-root permissions are clamped to read-only; the writes
# this workflow needs (contents:write for goreleaser to publish a
# GitHub Release, id-token:write for cosign keyless signing via
# GitHub OIDC) are granted at job scope only. OpenSSF Scorecard's
# Token-Permissions check flags any write granted at workflow root.
permissions:
  contents: read

env:
  COSIGN_EXPERIMENTAL: '1'

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-24.04
    permissions:
      # contents:write — goreleaser creates the GitHub Release and
      # uploads assets via the GitHub API.
      contents: write
      # id-token:write — cosign keyless signing exchanges this OIDC
      # token for a Sigstore Fulcio certificate; flakehub-cache uses
      # the same scope to authenticate to FlakeHub Cache.
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - uses: DeterminateSystems/flakehub-cache-action@e134de896b2302c1584a7b54ff35432708607d44 # v3.18.1

      - name: Unit tests before release
        run: nix develop --command task ci:test

      - name: GoReleaser (goreleaser, syft, cosign, nfpm all from the flake closure)
        run: nix develop --command task ci:release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: '1'
