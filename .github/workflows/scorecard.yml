#
# OpenSSF Scorecard: continuously audits supply-chain security
# posture and publishes a SARIF report to GitHub's security tab
# plus a public score on https://scorecard.dev. The badge in
# README.md links to that score.
#
# Scorecard publishes to scorecard.dev only for PUBLIC repositories
# — the public result store rejects writes from private repos and
# the default GITHUB_TOKEN lacks the GraphQL read scopes scorecard
# needs against private metadata ("Resource not accessible by
# integration"). The `if:` guard on the job below skips the run
# until the repository is flipped public. To run scorecard against
# a private repo, set a PAT with `repo` + `read:org` scopes as the
# `SCORECARD_TOKEN` secret and uncomment the `repo_token:` line.
#
# https://github.com/ossf/scorecard-action
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly Tuesday 06:10 UTC. Each scheduled workflow lands on a
    # distinct UTC minute so two crons never compete for the same
    # flakehub-cache shard:
    #   03:30  nightly (daily)
    #   04:30  trivy   (daily)
    #   04:45  vm-integration (daily)
    #   05:15  mutation (Mon only)
    #   04:10  codeql (Wed only)
    - cron: '10 6 * * 2'
  push:
    branches: [main]
  workflow_dispatch:

# Workflow-root permissions clamped to read-only so OpenSSF
# Scorecard's Token-Permissions check passes; the writes scorecard
# itself needs (security-events:write, id-token:write) are granted
# at job scope only. `read-all` would fail Scorecard's own check.
permissions:
  contents: read

jobs:
  analysis:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-24.04
    # Skip on private repos — scorecard.dev publishing requires
    # public visibility, and the default GITHUB_TOKEN cannot read
    # private GraphQL metadata. Flips on automatically when the
    # repo's visibility is changed to public.
    if: github.event.repository.private == false
    permissions:
      # `security-events: write` lets the action upload SARIF results.
      security-events: write
      # `id-token: write` is required for publishing to the public
      # scorecard.dev result store via OIDC.
      id-token: write
      contents: read
      # `actions: read` lets Scorecard inspect workflow files.
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
          # Uncomment + provide a PAT in SCORECARD_TOKEN to run
          # against a private repo. Default GITHUB_TOKEN suffices
          # for public.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        with:
          sarif_file: results.sarif
