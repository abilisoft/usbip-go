#
# OpenSSF Scorecard: continuously audits supply-chain security
# posture and publishes a SARIF report to GitHub's security tab
# plus a public score on https://scorecard.dev. The badge in
# README.md links to that score.
#
# Scorecard publishes to scorecard.dev only for PUBLIC repositories
# — the public result store rejects writes from private repos and
# the default GITHUB_TOKEN lacks the GraphQL read scopes scorecard
# needs against private metadata ("Resource not accessible by
# integration"). The `if:` guard on the job below skips the run if repository
# visibility is changed to private. To run scorecard against a private repo,
# set a PAT with `repo` + `read:org` scopes as the
# `SCORECARD_TOKEN` secret and uncomment the `repo_token:` line.
#
# https://github.com/ossf/scorecard-action
name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly Tuesday 06:10 UTC. Each scheduled workflow lands on a
    # distinct UTC minute so scheduled workflows do not compete for runners:
    #   03:30  nightly (daily)
    #   04:30  trivy   (daily)
    #   05:15  mutation (Mon only)
    #   04:10  codeql (Wed only)
    - cron: '10 6 * * 2'
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Workflow-root permissions clamped to read-only so OpenSSF
# Scorecard's Token-Permissions check passes; the writes scorecard
# itself needs (security-events:write, id-token:write) are granted
# at job scope only. `read-all` would fail Scorecard's own check.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: OpenSSF Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Skip on private repos — scorecard.dev publishing requires
    # public visibility, and the default GITHUB_TOKEN cannot read
    # private GraphQL metadata. The condition follows repository visibility.
    if: github.event.repository.private == false
    permissions:
      # `security-events: write` lets the action upload SARIF results.
      security-events: write
      # `id-token: write` is required for publishing to the public
      # scorecard.dev result store via OIDC.
      id-token: write
      contents: read
      # `actions: read` lets Scorecard inspect workflow files.
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}
          # Uncomment + provide a PAT in SCORECARD_TOKEN to run
          # against a private repo. Default GITHUB_TOKEN suffices
          # for public.
          # repo_token: ${{ secrets.SCORECARD_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        if: >-
          github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: results.sarif
