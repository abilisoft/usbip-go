name: Release validate

# Tag-only workflow. Runs the changelog-check gate when a v*.*.*
# tag is pushed. Lives in its own file so cutting a release does
# not re-run the entire ci.yml suite (lint / unit / coverage /
# cross-compile / etc.) — the same content was already validated
# at branch-push time before the tag was cut.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  changelog-check:
    name: Changelog check (git-cliff) — release tags only
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@ab6bcb2d5af0e904d04aea750e2089e9dc4cbfdd # v13
      - uses: DeterminateSystems/magic-nix-cache-action@87b14cf437d03d37989d87f0fa5ce4f5dc1a330b # v8
      - name: Verify CHANGELOG.md matches history at this tag
        run: nix develop --command task ci:changelog:check
