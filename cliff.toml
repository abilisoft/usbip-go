#
# git-cliff configuration — CHANGELOG.md generator
# Regenerate: `task changelog`
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# Header inserted once at the top of the CHANGELOG.
header = """
# Changelog

All notable changes to this project are documented here.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and entries are generated from [Conventional Commits](https://www.conventionalcommits.org/) via `git-cliff`.

"""

# Template for a single release section. Uses Tera syntax.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""

# Footer inserted once at the bottom.
footer = ""

# Trim leading/trailing whitespace from each rendered section.
trim = true

# Postprocessors run over the fully assembled output. None needed.
postprocessors = []

[git]
# Only parse commits that look like Conventional Commits; reject the rest.
conventional_commits = true

# Reject commits that don't parse as Conventional Commits (keeps history clean).
filter_unconventional = true

# Split commits on newlines; each line becomes a separate entry (useful for co-commits).
split_commits = false

# Preprocess commit messages before parsing.
commit_preprocessors = [
    # Strip noise that a hook or tool might prepend.
    { pattern = '\s+$', replace = "" },
    # Scrub references to the development tooling used during the
    # initial implementation push; the public CHANGELOG should
    # describe what changed in the project, not what reviewer found
    # the bug or which directory hosts editor state.
    { pattern = '\bcodex\b', replace = "review" },
    { pattern = '\bClaude Code\b', replace = "developer tooling" },
    { pattern = '\.claude\b', replace = ".editor-tooling" },
    { pattern = '\bAI assistant state\b', replace = "editor tooling state" },
    { pattern = '\bAI assistant\b', replace = "developer tooling" },
]

# Map Conventional Commit types into human-friendly section headings.
# Ordering here determines section order in the output.
commit_parsers = [
    { message = "^feat",     group = "Features" },
    { message = "^fix",      group = "Bug Fixes" },
    { message = "^perf",     group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs",     group = "Documentation" },
    { message = "^test",     group = "Tests" },
    { message = "^ci",       group = "CI & Build" },
    { message = "^build",    group = "CI & Build" },
    { message = "^deps",     group = "Dependencies" },
    # Drop the release commit itself — the chore(release): vX.Y.Z
    # commit is the one that ships the regenerated CHANGELOG, and
    # listing it inside the very section it created creates an
    # un-amendable circular dependency (every regen would change
    # its own short-SHA entry, never converging).
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore",    group = "Chores" },
    { message = "^style",    group = "Style" },
    # Anything with BREAKING CHANGE or ! after type — surfaced first.
    { body = ".*BREAKING CHANGE.*", group = "⚠️ Breaking Changes" },
    { message = "^[a-z]+!",         group = "⚠️ Breaking Changes" },
    # Everything else is skipped.
    { message = ".*", skip = true },
]

# Protect against merge/revert noise.
filter_commits = true
# Tag pattern to recognize as a release.
tag_pattern = "v[0-9]*"
# Skip tags (none for now).
skip_tags = ""
# Sort commits inside each group newest-first.
sort_commits = "newest"

# Optional: include the commit link.
# link_parsers = [
#     { pattern = "#(\\d+)", href = "https://github.com/abilisoft/usbip-go/issues/$1" },
# ]
