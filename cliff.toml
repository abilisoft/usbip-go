#
# git-cliff configuration — generates GitHub Release notes at tag time
# (.github/workflows/release.yml runs `git-cliff --latest --strip header
# --output build/release-notes.md`; goreleaser then publishes that file
# as the Release body via `--release-notes`). --latest renders the
# section for the most-recent matching tag and works in both first-tag
# and Nth-tag scenarios; an earlier shape using `--unreleased --tag $TAG`
# emitted an empty body because actions/checkout puts the pushed tag at
# HEAD, so cliff saw "zero commits not yet in $TAG" and returned only a
# version heading. There is no checked-in CHANGELOG.md to regenerate.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# Header is `--strip header`-stripped at release time, but kept here
# so `git-cliff` invoked without `--strip` (e.g. ad-hoc local preview)
# still produces a sensible top-of-file banner.
header = """
# Changelog

All notable changes to this project are documented here.
The format follows [Keep a Changelog](https://keepachangelog.com/en/1.1.0/) and entries are generated from [Conventional Commits](https://www.conventionalcommits.org/) via `git-cliff`.

"""

# Template for a single release section. Uses Tera syntax.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""

# Footer inserted once at the bottom.
footer = ""

# Trim leading/trailing whitespace from each rendered section.
trim = true

# Postprocessors run over the fully assembled output. None needed.
postprocessors = []

[git]
# Only parse commits that look like Conventional Commits; reject the rest.
conventional_commits = true

# Reject commits that don't parse as Conventional Commits (keeps history clean).
filter_unconventional = true

# Split commits on newlines; each line becomes a separate entry (useful for co-commits).
split_commits = false

# Preprocess commit messages before parsing.
commit_preprocessors = [
    # Strip noise that a hook or tool might prepend.
    { pattern = '\s+$', replace = "" },
    # Scrub references to the development tooling used during the
    # initial implementation push; the rendered release notes should
    # describe what changed in the project, not what reviewer found
    # the bug or which directory hosts editor state.
    { pattern = '\bcodex\b', replace = "review" },
    { pattern = '\bClaude Code\b', replace = "developer tooling" },
    { pattern = '\.claude\b', replace = ".editor-tooling" },
    { pattern = '\bAI assistant state\b', replace = "editor tooling state" },
    { pattern = '\bAI assistant\b', replace = "developer tooling" },
]

# Map Conventional Commit types into human-friendly section headings.
# Ordering here determines section order in the output.
commit_parsers = [
    # Breaking changes win over type — match BEFORE the type-grouping
    # parsers so a `feat(scope)!:` or any commit body with
    # `BREAKING CHANGE:` lands in its own section instead of being
    # silently absorbed into Features / Fixes / etc. The bare
    # `^[a-z]+!` regex would miss scoped breaking commits, so include
    # the optional parenthesised scope.
    { body = ".*BREAKING CHANGE.*",      group = "Breaking Changes" },
    { message = "^[a-z]+(\\(.+\\))?!",   group = "Breaking Changes" },
    # Drop the release commit itself — a chore(release): vX.Y.Z
    # commit is meta-noise in user-facing release notes; readers
    # learn the version from the GitHub Release title, not a bullet
    # in the body.
    { message = "^chore\\(release\\)",   skip = true },
    { message = "^feat",                 group = "Features" },
    { message = "^fix",                  group = "Bug Fixes" },
    { message = "^perf",                 group = "Performance" },
    { message = "^refactor",             group = "Refactoring" },
    { message = "^docs",                 group = "Documentation" },
    { message = "^test",                 group = "Tests" },
    { message = "^ci",                   group = "CI & Build" },
    { message = "^build",                group = "CI & Build" },
    { message = "^deps",                 group = "Dependencies" },
    { message = "^chore",                group = "Chores" },
    { message = "^style",                group = "Style" },
    # Everything else is skipped.
    { message = ".*", skip = true },
]

# Protect against merge/revert noise.
filter_commits = true
# Tag pattern to recognize as a release. Anchored regex that ONLY
# matches a full SemVer triple (vMAJOR.MINOR.PATCH) — no pre-release
# suffix, no build metadata. Cliff therefore ignores tags such as
# v1.0.1-rc1 entirely, so `--latest` always resolves to the most
# recent STABLE release. Without this anchor, `tag_pattern = "v[0-9]*"`
# would also match v1.0.1-rc1 (which sorts as the most recent tag if
# pushed before v1.0.1) and `--latest` would render the wrong section.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
# Skip tags (none for now).
skip_tags = ""
# Sort commits inside each group newest-first.
sort_commits = "newest"

# Optional: include the commit link.
# link_parsers = [
#     { pattern = "#(\\d+)", href = "https://github.com/abilisoft/usbip-go/issues/$1" },
# ]
