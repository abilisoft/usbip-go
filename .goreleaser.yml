# SPDX-FileCopyrightText: 2026 AbiliSoft
# SPDX-License-Identifier: Apache-2.0
#
# GoReleaser config for usbip-go per spec §10.3.
#
# Produces:
#   - linux/{amd64,arm64,arm} binary for cmd/usbip-go (single binary,
#     ADR-0011 — flat verbs `usbip-go serve`, `usbip-go attach`, ...)
#   - tar.gz archives including LICENSE, README, systemd units
#   - deb + rpm packages via nfpms
#   - SHA-256 checksums file
#   - SBOM per archive (SPDX) via syft
#   - Cosign keyless signature on the checksums file (GitHub OIDC)
#   - Reproducible builds via mod_timestamp: "{{ .CommitTimestamp }}"
#
# Invoke locally:  task release:snapshot
# Invoke in CI:    goreleaser release --clean  (see .github/workflows/release.yml)
version: 2

project_name: usbip-go

# All GoReleaser output lands under ./build/dist so every build artefact
# in the tree is beneath ./build/ and `task clean` is a single rm.
dist: build/dist

before:
  hooks:
    - go mod tidy
    - go mod download

builds:
  - id: usbip-go
    main: ./cmd/usbip-go
    binary: usbip-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    ids:
      - usbip-go
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}
    files:
      - LICENSE
      - README.md
      - CONTRIBUTING.md
      - contrib/systemd/usbip-go.service
      - contrib/systemd/usbip-go.socket
      - docs/*.md

nfpms:
  - id: default
    ids:
      - usbip-go
    package_name: usbip-go
    vendor: abilisoft
    homepage: https://github.com/abilisoft/usbip-go
    maintainer: abilisoft <oss@abilisoft.com>
    description: |-
      Pure-Go reimplementation of USB/IP userspace for Linux. Single
      binary `usbip-go` exposes flat verbs (ADR-0011): `usbip-go serve`
      runs the daemon (parallel install alongside upstream `usbipd`);
      `usbip-go attach`, `usbip-go detach`, `usbip-go list`,
      `usbip-go bind`, `usbip-go unbind`, `usbip-go drain` cover
      client and operator commands.
    license: Apache-2.0
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: contrib/systemd/usbip-go.service
        dst: /usr/lib/systemd/system/usbip-go.service
      - src: contrib/systemd/usbip-go.socket
        dst: /usr/lib/systemd/system/usbip-go.socket
      - src: README.md
        dst: /usr/share/doc/usbip-go/README.md
      - src: LICENSE
        dst: /usr/share/doc/usbip-go/LICENSE

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot-{{ .ShortCommit }}"

# SBOM per archive in SPDX JSON. Requires syft on PATH; CI installs it
# via the anchore/sbom-action step before invoking goreleaser.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.sbom.json"

# Cosign keyless signing of the checksums file. Uses GitHub OIDC; the
# release workflow grants id-token: write for this to succeed. Signing
# ONLY the checksums means the per-artifact signatures are implied by
# the transitive sha256.
signs:
  - id: cosign-keyless
    cmd: cosign
    # Bundle format (cosign v3 default): one Sigstore JSON file per
    # signed artefact carrying the signature, leaf certificate, and
    # rekor inclusion proof. The legacy two-file (--output-signature
    # + --output-certificate) layout was removed in cosign v3.x — the
    # flags now emit a deprecation warning and cosign refuses to
    # write anything unless --bundle (or --new-bundle-format=false +
    # --use-signing-config=false) is supplied. Migrating to --bundle
    # is the forward-compatible option and avoids stacking deprecated
    # knobs that may be removed in v4.
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--yes"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum
    output: true

changelog:
  # NOTE: `disable: true` and `--release-notes=<file>` are mutually
  # exclusive in goreleaser v2 — the entire changelog pipe is skipped
  # when disabled, including the branch that loads the
  # `--release-notes` file into the release body. See
  # https://github.com/goreleaser/goreleaser/blob/v2.15.4/internal/pipe/changelog/changelog.go
  # `Pipe.Skip` (returns true when Changelog.Disable is set; Run is
  # then never invoked) versus `Pipe.Run` (loads ReleaseNotesFile into
  # ctx.ReleaseNotes, returns early, internal generation skipped).
  #
  # We want the release body to come from git-cliff (via the workflow
  # step that writes build/release-notes.md and the env-var that hands
  # it to goreleaser as --release-notes). To make that work we must
  # NOT disable the changelog pipe — otherwise the file is loaded but
  # then dropped, leaving the release body as the bare body-template
  # newline (a 1-byte body, which is the symptom we hit on every v1.0.0
  # tag-push prior to this fix).
  #
  # Leaving the changelog block effectively unset: the pipe runs, sees
  # ReleaseNotesFile is set (CI run), loads the file, returns before
  # invoking the internal git-log generator. Local snapshot runs
  # (no RELEASE_NOTES env, no --release-notes) fall back to the
  # default git-log changelog, which is harmless for snapshots.
  use: github

release:
  # draft:false + mode:replace means goreleaser publishes the release
  # immediately when the tag fires, replacing whatever placeholder
  # GitHub may have created. Release notes come from the
  # `--release-notes` file populated by the workflow's git-cliff step.
  draft: false
  prerelease: auto
  mode: replace
  name_template: "{{ .ProjectName }} {{ .Tag }}"
  github:
    owner: abilisoft
    name: usbip-go
